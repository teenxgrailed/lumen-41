services:
  app:
    image: ghcr.io/teenxgrailed/needt:main
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Pin the container's bind address and port so unrelated PORT/HOSTNAME values
    # in the operator's .env cannot change them (env_file is overridden by
    # environment). The Next.js standalone server binds to HOSTNAME:PORT, so this
    # keeps the 3000:3000 publish pointed at a reachable, listening server.
    # See issue #151.
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://fluid:fluid@db:5432/fluid_calendar
      - DIRECT_URL=postgresql://fluid:fluid@db:5432/fluid_calendar
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    image: ghcr.io/teenxgrailed/needt:main
    command: ["node", "dist/worker/index.js"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://fluid:fluid@db:5432/fluid_calendar
      - DIRECT_URL=postgresql://fluid:fluid@db:5432/fluid_calendar
      - REDIS_URL=redis://redis:6379
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:1235/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      start_period: 2m
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  collaboration:
    image: ghcr.io/teenxgrailed/needt:main
    command: ["node", "dist/collaboration/index.mjs"]
    ports:
      - "1234:1234"
    env_file:
      - .env
    environment:
      - COLLABORATION_HOST=0.0.0.0
      - COLLABORATION_PORT=1234
      - DATABASE_URL=postgresql://fluid:fluid@db:5432/fluid_calendar
      - DIRECT_URL=postgresql://fluid:fluid@db:5432/fluid_calendar
      - REDIS_URL=redis://redis:6379
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:1234/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=fluid
      - POSTGRES_PASSWORD=fluid
      - POSTGRES_DB=fluid_calendar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluid -d fluid_calendar"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_data:
