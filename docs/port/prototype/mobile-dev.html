.mb-step { animation: mb-step-in 0.26s cubic-bezier(0.2, 0.9, 0.24, 1); }

<script type="text/babel">
/* THE PHONE — one live phone and a light / dark switch, nothing else. On a
   real phone (a narrow viewport) the device frame goes and the app is the
   screen. ?theme=dark|light picks the theme once; otherwise the phone wears
   the one theme desktop and phone share (needtSettings "theme", synced live
   through needtSync — a change on the desktop arrives here), falling back to
   this page's last look (needt.phone.theme). Settings inside menu A and the
   switch above the phone change it for both. */
function phoneTheme() {
  try {
    const q = new URLSearchParams(window.location.search).get("theme");
    if (q) return q === "dark" || q === "dim" ? "dark" : "light";
    const S = window.needtSettings;
    if (S && S.has("theme")) return v2pResolveTheme(S.get("theme"));
    return localStorage.getItem("needt.phone.theme") === "dark" ? "dark" : "light";
  } catch (e) { return "light"; }
}
const phoneBare = () => window.innerWidth < 500;
function PhonePage() {
  const [theme, setThemeRaw] = React.useState(phoneTheme);
  const keep = (t) => { setThemeRaw(t); if (window.needtSync) window.needtSync.set("needt.phone.theme", t); };
  const setTheme = (v) => {
    const t = v === "dark" ? "dark" : "light";
    keep(t);
    const S = window.needtSettings;
    if (S && v2pResolveTheme(S.get("theme")) !== t) S.set("theme", t);
  };
  React.useEffect(() => (window.needtSync ? window.needtSync.subscribe("needt.settings", (v, info) => {
    if (info.origin === "remote" && v && v.theme) keep(v2pResolveTheme(v.theme));
  }) : undefined), []);
  const [bare, setBare] = React.useState(phoneBare);
  React.useEffect(() => {
    const r = () => setBare(phoneBare());
    window.addEventListener("resize", r);
    return () => window.removeEventListener("resize", r);
  }, []);
  if (bare) return <window.V2pLivePhone bare theme={theme} onTheme={setTheme} />;
  return (
    <div className={"app v2p-page " + (theme === "dark" ? "dark" : "paper")} data-phone-page="">
      <div className="mn-theme" role="radiogroup" aria-label="Theme">
        {[["light", "Light"], ["dark", "Dark"]].map(([id, label]) => (
          <button key={id} type="button" role="radio" aria-checked={theme === id} className={"mn-theme-btn" + (theme === id ? " is-on" : "")} onClick={() => setTheme(id)} data-mn-theme={id}>{label}</button>
        ))}
      </div>
      <window.V2pLivePhone theme={theme} onTheme={setTheme} />
    </div>
  );
}
const __root = document.getElementById("root");
if (__root) ReactDOM.createRoot(__root).render(<PhonePage />);
</script>
