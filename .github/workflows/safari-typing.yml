name: Safari typing test
on:
  push:
    branches: ["safari-probe/typing*"]
jobs:
  t:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: idb
        run: |
          set -euo pipefail
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion python@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$HOME/idbenv"
          "$HOME/idbenv/bin/pip" install fb-idb
          echo "$HOME/idbenv/bin" >> "$GITHUB_PATH"
      - name: sim
        run: |
          set -euo pipefail
          (cd .github/safari && nohup python3 -m http.server 3000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          xcrun simctl list runtimes -j > rt.json
          read -r RUNTIME DEVTYPE <<< "$(python3 - rt.json <<'PY'
          import json, re, sys
          rts = [r for r in json.load(open(sys.argv[1]))["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable", True)]
          rts.sort(key=lambda r: [int(p) for p in re.findall(r"\d+", r["version"])])
          rt = rts[-1]; best = None
          for d in rt["supportedDeviceTypes"]:
              m = re.fullmatch(r"iPhone (\d+) Pro", d["name"])
              if m and (best is None or int(m.group(1)) > best[0]): best = (int(m.group(1)), d["identifier"])
          print(rt["identifier"], best[1])
          PY
          )"
          UDID="$(xcrun simctl create probe "$DEVTYPE" "$RUNTIME")"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          (idb_companion --udid "$UDID" --grpc-port 10882 > companion.log 2>&1 &)
          for i in $(seq 1 20); do sleep 5; idb connect localhost 10882 && break; done
      - name: strategies
        run: |
          set -uo pipefail
          mkdir -p shots
          idbx() { echo "+ idb $*"; idb "$@" --udid "$UDID" 2>&1; echo "rc=$?"; }
          load() { xcrun simctl openurl "$UDID" "http://127.0.0.1:3000/form.html?$1" || true; sleep 25; }
          shot() { xcrun simctl io "$UDID" screenshot "shots/$1.png" >/dev/null 2>&1; }
          # A: tap, text
          load A; idbx ui tap 201 316; sleep 10; shot A1; idbx ui text "hello@x.io"; sleep 20; shot A2
          # B: same page, text again
          idbx ui text "second"; sleep 20; shot B1
          # C: fresh page, tap, one-char warmup then text
          load C; idbx ui tap 201 316; sleep 10; idbx ui text "a"; sleep 10; idbx ui text "bcdef"; sleep 20; shot C1
          # D: fresh page, tap, key sequence of letters (HID 4=a..)
          load D; idbx ui tap 201 316; sleep 10; idbx ui key-sequence 4 5 6 7; sleep 20; shot D1
          idbx ui key 43; sleep 10; idbx ui key-sequence 8 9 10; sleep 20; shot D2
          # E: fresh page, tap email, text, tap password, text
          load E; idbx ui tap 201 316; sleep 10; idbx ui text "mail@x.io"; sleep 20; idbx ui tap 201 399; sleep 10; idbx ui text "secret"; sleep 20; shot E1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typing-shots
          path: |
            shots
            companion.log
