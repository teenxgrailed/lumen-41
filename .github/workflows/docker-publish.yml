name: Build and publish Needt

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Only the default branch can release. Without this every pull request's
    # CI run also started a run here, which then skipped at the `gates` gate
    # after taking a slot in the concurrency queue below.
    branches: [main]
  workflow_dispatch:

# `workflow_run` fires for EVERY branch's CI, not just the default one, and
# on that event `github.ref` is always the default branch — so a single group
# held the real release and every pull request's no-op trigger together.
# Queued runs in one group cancel each other as newer ones arrive, which is
# how a merge to main could finish CI and never be published. Key the group
# on the branch whose CI actually ran.
concurrency:
  group: >-
    needt-production-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/teenxgrails/needt
  # Only `changes` reads this; every later job uses the SHA it decided.
  HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# Production runs prebuilt images. CI builds web, worker and collaboration
# here and pushes them tagged with the full commit SHA; Coolify only pulls the
# tag and restarts. Building on the production host is what used to starve
# the running site: ~17 minutes of three Node builds per merge on the same
# four cores as Postgres, and two outages when builds ran side by side.
jobs:
  changes:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      deploy: ${{ steps.decide.outputs.deploy }}
      previous_sha: ${{ steps.decide.outputs.previous_sha }}
    env:
      WEB_HEALTH_URL: ${{ secrets.NEEDT_PRODUCTION_HEALTH_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          # The diff below runs against whatever production last served,
          # which can be several merges back.
          fetch-depth: 0
      - name: Decide what this run releases
        id: decide
        run: |
          previous_sha=unknown
          response=$(curl --silent --show-error --max-time 30 "${WEB_HEALTH_URL:-}" || true)
          candidate=$(printf '%s' "$response" | jq -r \
            'if .ok == true and .db == "ok" then (.buildSha // empty) else empty end' \
            2>/dev/null || true)
          if [[ "$candidate" =~ ^[0-9a-fA-F]{40}$ ]]; then
            previous_sha=$candidate
          fi
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"

          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          # Compare against what production actually runs, not HEAD~1, so
          # merges that landed while a release was skipped are never lost.
          # Unknown history means deploy: a skipped release is the worse error.
          if [ "$previous_sha" = unknown ] || ! git cat-file -e "$previous_sha^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$previous_sha" "$HEAD_SHA")
          shipped=$(printf '%s\n' "$changed" | grep -vE \
            '^(docs/|openspec/|\.agents/|\.claude/|design-refs/)|\.md$' || true)
          if [ -z "$changed" ] || [ -n "$shipped" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed since $previous_sha; nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  gates:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - name: Verify checked-out release commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.sha }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint -- --max-warnings=0
      - run: npm run check:branding
      - run: npm run type-check
      - run: npm run test:unit -- --runInBand
      - run: npm run build
      - run: npm run build:worker
      - run: npm run build:collaboration
      - name: Verify executable collaboration runtime
        run: timeout 30s npm run check:collaboration-runtime

  images:
    needs: [changes, gates]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: production
            image: web
          - target: worker
            image: worker
          - target: collaboration
            image: collaboration
    env:
      RELEASE_SHA: ${{ needs.changes.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - name: Verify checked-out release commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Validate build-time configuration
        if: matrix.target == 'production'
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_COLLABORATION_URL: ${{ vars.NEXT_PUBLIC_COLLABORATION_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        # Next inlines these into the browser bundle. A missing one does not
        # fail the build; it ships a site without push or error reporting.
        run: |
          : "${NEXT_PUBLIC_APP_URL:?vars.NEXT_PUBLIC_APP_URL is required}"
          : "${NEXT_PUBLIC_COLLABORATION_URL:?vars.NEXT_PUBLIC_COLLABORATION_URL is required}"
          : "${NEXT_PUBLIC_VAPID_PUBLIC_KEY:?vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY is required}"
          : "${NEXT_PUBLIC_SENTRY_DSN:?vars.NEXT_PUBLIC_SENTRY_DSN is required}"
          : "${NEXT_PUBLIC_SENTRY_ENVIRONMENT:?vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT is required}"
          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is required}"
          : "${SENTRY_ORG:?SENTRY_ORG is required}"
          : "${SENTRY_PROJECT:?SENTRY_PROJECT is required}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ env.RELEASE_SHA }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          build-args: |
            NEEDT_BUILD_SHA=${{ env.RELEASE_SHA }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_COLLABORATION_URL=${{ vars.NEXT_PUBLIC_COLLABORATION_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
            sentry_org=${{ secrets.SENTRY_ORG }}
            sentry_project=${{ secrets.SENTRY_PROJECT }}
          # One cache scope per target, or the three builds evict each other.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  deploy-web:
    needs: [changes, images]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
      WEB_HEALTH_URL: ${{ secrets.NEEDT_PRODUCTION_HEALTH_URL }}
      DEPLOY_SHA: ${{ needs.changes.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.changes.outputs.sha }}
          # release-is-needed.sh compares commits with git merge-base.
          fetch-depth: 0
      - name: Validate production deployment configuration
        run: |
          : "${COOLIFY_API_URL:?COOLIFY_API_URL is required}"
          : "${COOLIFY_TOKEN:?COOLIFY_API_TOKEN is required}"
          : "${WEB_UUID:?COOLIFY_WEB_UUID is required}"
          : "${WEB_HEALTH_URL:?NEEDT_PRODUCTION_HEALTH_URL is required}"
      # Releases are not serialised against merges, so a finished build is
      # usually not the head of main any more. It deploys anyway, unless
      # production already runs it or a descendant, so the newest finished
      # build always ships and an older one never rolls a newer one back.
      - name: Check production still needs this release
        id: needed
        run: ./scripts/release-is-needed.sh "$WEB_HEALTH_URL" buildSha
      # Web goes first: its entrypoint applies the database migrations the
      # worker and collaboration images of the same release expect.
      - name: Deploy the web image
        id: deploy
        if: ${{ steps.needed.outputs.needed == 'true' }}
        run: ./scripts/coolify-deploy-image.sh "$WEB_UUID" web
      - name: Wait for the web SHA and database health
        if: ${{ steps.deploy.outputs.deployed == 'true' }}
        run: |
          # Pulling and restarting a prebuilt image takes a minute or two;
          # ten minutes keeps a slow pull from reading as a failure. The
          # pinned deploy serves exactly DEPLOY_SHA; a descendant is also
          # fine (the unpinned fallback deploys the head of main).
          for attempt in $(seq 1 60); do
            response=$(curl --fail --silent --show-error --max-time 30 "$WEB_HEALTH_URL" || true)
            healthy_sha=$(printf '%s' "$response" | jq -r \
              'if .ok == true and .db == "ok" then (.buildSha // "") else "" end' \
              2>/dev/null || true)
            if [ "$healthy_sha" = "$DEPLOY_SHA" ] ||
              { [[ "$healthy_sha" =~ ^[0-9a-f]{40}$ ]] &&
                git cat-file -e "$healthy_sha^{commit}" 2>/dev/null &&
                git merge-base --is-ancestor "$DEPLOY_SHA" "$healthy_sha"; }; then
              echo "Production web is healthy at $healthy_sha (release $DEPLOY_SHA)"
              exit 0
            fi
            echo "Waiting for production web SHA (attempt $attempt/60)"
            sleep 10
          done
          echo "Production web did not reach $DEPLOY_SHA or a descendant" >&2
          exit 1
      - name: Record rollback instructions
        if: ${{ failure() }}
        run: |
          previous='${{ needs.changes.outputs.previous_sha }}'
          {
            echo "## Production deployment failed"
            echo
            echo "Previous healthy web SHA: \`${previous:-unknown}\`."
            echo "Inspect the current production SHA before acting; a newer healthy release must not be rolled back."
            echo "To roll back, use the resource's Deployments view in Coolify; Migrations only move forward, so a rollback is safe only across additive schema changes."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Production deployment failed; see the run summary."

  deploy-runtimes:
    needs: [changes, images, deploy-web]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKER_UUID: ${{ secrets.COOLIFY_WORKER_UUID }}
      COLLABORATION_UUID: ${{ secrets.COOLIFY_COLLABORATION_UUID }}
      WEB_HEALTH_URL: ${{ secrets.NEEDT_PRODUCTION_HEALTH_URL }}
      COLLABORATION_HEALTH_URL: ${{ secrets.NEEDT_PRODUCTION_COLLABORATION_HEALTH_URL }}
      DEPLOY_SHA: ${{ needs.changes.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.changes.outputs.sha }}
          # release-is-needed.sh compares commits with git merge-base.
          fetch-depth: 0
      - name: Verify checked-out release commit
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate runtime deployment configuration
        run: |
          : "${COOLIFY_API_URL:?COOLIFY_API_URL is required}"
          : "${COOLIFY_TOKEN:?COOLIFY_API_TOKEN is required}"
          : "${WORKER_UUID:?COOLIFY_WORKER_UUID is required}"
          : "${COLLABORATION_UUID:?COOLIFY_COLLABORATION_UUID is required}"
          : "${WEB_HEALTH_URL:?NEEDT_PRODUCTION_HEALTH_URL is required}"
          : "${COLLABORATION_HEALTH_URL:?NEEDT_PRODUCTION_COLLABORATION_HEALTH_URL is required}"
      - name: Check production still needs this release
        id: needed
        run: >-
          ./scripts/release-is-needed.sh
          "$WEB_HEALTH_URL" workerBuildSha
          "$COLLABORATION_HEALTH_URL" buildSha
      - name: Deploy the worker image
        id: worker
        if: ${{ steps.needed.outputs.needed == 'true' }}
        run: ./scripts/coolify-deploy-image.sh "$WORKER_UUID" worker
      - name: Deploy the collaboration image
        id: collaboration
        if: ${{ steps.needed.outputs.needed == 'true' }}
        run: ./scripts/coolify-deploy-image.sh "$COLLABORATION_UUID" collaboration
      - name: Wait for all runtime SHAs
        if: ${{ steps.worker.outputs.deployed == 'true' || steps.collaboration.outputs.deployed == 'true' }}
        env:
          RUNTIME_SHA_TIMEOUT_MS: "600000"
          RUNTIME_SHA_POLL_INTERVAL_MS: "10000"
        run: npm run check:runtime-shas
      - name: Record rollback instructions
        if: ${{ failure() }}
        run: |
          previous='${{ needs.changes.outputs.previous_sha }}'
          {
            echo "## Runtime deployment failed"
            echo
            echo "Previous healthy web SHA: \`${previous:-unknown}\`."
            echo "Inspect the current production SHAs before acting; a newer healthy release must not be rolled back."
            echo "To roll back, use each runtime's Deployments view in Coolify."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Runtime deployment failed; see the run summary."
