name: Safari phone

# The phone app in real Mobile Safari (iOS Simulator), status bar and floating
# toolbar tint included, so Safari 26/27 "bar bands" can be seen without a phone.
# A throwaway server on the runner with the CI-only secrets; nothing touches
# production. The app is signed into through its normal sign-in form.

on:
  push:
    branches:
      - "safari-probe/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to show in Safari
        required: false
        default: main
        type: string
      quick:
        description: Skip the installed-app steps (about 40 min, and the part that stalls most)
        required: false
        default: false
        type: boolean

concurrency:
  group: safari-phone-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: postgresql://needt:needt@localhost:5432/needt_test
  DIRECT_URL: postgresql://needt:needt@localhost:5432/needt_test
  SHADOW_DATABASE_URL: postgresql://needt:needt@localhost:5432/needt_shadow
  REDIS_URL: redis://localhost:6379
  NEXTAUTH_URL: http://127.0.0.1:3000
  NEXTAUTH_SECRET: needt-ci-only-secret-not-valid-outside-github-actions
  RATE_LIMIT_HASH_SECRET: needt-ci-rate-limit-hash-secret
  NODE_OPTIONS: --max-old-space-size=5120
  PROBE_EMAIL: ci-pro@needt.local
  PROBE_PASSWORD: Needt-ci-Password1

jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 110
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Start PostgreSQL and Redis
        run: |
          set -euo pipefail
          brew install postgresql@16 redis
          brew services start postgresql@16
          brew services start redis
          PGBIN="$(brew --prefix postgresql@16)/bin"
          echo "$PGBIN" >> "$GITHUB_PATH"
          for i in $(seq 1 30); do "$PGBIN/pg_isready" -h localhost && break; sleep 2; done
          "$PGBIN/psql" -h localhost -d postgres -c "CREATE ROLE needt LOGIN SUPERUSER PASSWORD 'needt'"
          "$PGBIN/createdb" -h localhost -O needt needt_test
          "$PGBIN/createdb" -h localhost -O needt needt_shadow
          redis-cli ping

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/ci-seed.ts

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build and start the app
        run: |
          set -euo pipefail
          npm run build
          nohup npx next start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 < /dev/null &
          disown
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/auth/signin && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/next.log"
          exit 1

      # What iOS reads on Add to Home Screen, in the HTML the server sends to a
      # phone: the manifest and apple-mobile-web-app-* tags inside <head>, and
      # redirects that stay on 127.0.0.1. Judged in the verdict, after the shots.
      - name: Install tags in <head>
        id: head
        run: |
          set -o pipefail
          mkdir -p debug
          python3 .github/safari/head.py http://127.0.0.1:3000 / /today /auth/signin /tasks 2>&1 | tee debug/install-head.txt
        continue-on-error: true

      - name: Install idb
        run: |
          set -euo pipefail
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion
          # fb-idb predates the newest asyncio changes; give it Python 3.12
          brew install python@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$HOME/idbenv"
          "$HOME/idbenv/bin/pip" install fb-idb pillow
          echo "$HOME/idbenv/bin" >> "$GITHUB_PATH"
          "$HOME/idbenv/bin/idb" --help | head -3

      - name: Boot an iPhone simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json"
          read -r RUNTIME DEVTYPE <<< "$(python3 - "$RUNNER_TEMP/runtimes.json" <<'PY'
          import json, re, sys
          rts = [r for r in json.load(open(sys.argv[1]))["runtimes"]
                 if r.get("platform") == "iOS" and r.get("isAvailable", True)]
          rts.sort(key=lambda r: [int(p) for p in re.findall(r"\d+", r["version"])])
          rt = rts[-1]
          best = None
          for d in rt["supportedDeviceTypes"]:
              m = re.fullmatch(r"iPhone (\d+) Pro", d["name"])
              if m and (best is None or int(m.group(1)) > best[0]):
                  best = (int(m.group(1)), d["identifier"])
          print(rt["identifier"], best[1])
          PY
          )"
          echo "runtime=$RUNTIME devtype=$DEVTYPE"
          UDID="$(xcrun simctl create probe "$DEVTYPE" "$RUNTIME")"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          tmo() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          for i in 1 2 3; do
            xcrun simctl boot "$UDID" || true
            tmo 300 xcrun simctl bootstatus "$UDID" -b && break
            echo "boot attempt $i hung; restarting the simulator"
            xcrun simctl shutdown "$UDID" || true
          done
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl ui "$UDID" appearance light
          (idb_companion --udid "$UDID" --grpc-port 10882 > "$RUNNER_TEMP/companion.log" 2>&1 &)
          for i in $(seq 1 12); do
            sleep 5
            tmo 30 idb connect localhost 10882 && break
          done
          tmo 60 idb list-targets

      - name: Sign in through the sign-in form
        timeout-minutes: 25
        run: |
          set +e
          set -uo pipefail
          mkdir -p shots debug
          # One host everywhere: the session cookie and the CSRF check are bound to
          # NEXTAUTH_URL (127.0.0.1); a page opened on localhost never signs in.
          HOST=http://127.0.0.1:3000
          export PGPASSWORD=needt
          tmo() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          PSQL="tmo 20 psql -h localhost -U needt -d needt_test -tAq"
          # openurl right after boot can time out (code 60): retry
          openurl() {
            for i in 1 2 3 4 5 6; do
              tmo 60 xcrun simctl openurl "$UDID" "$1" && return 0
              sleep 10
            done
            return 1
          }
          # the simulator is slow on a shared runner: wait until Safari has painted
          # a real page (a blank or error page is a tiny JPEG)
          loaded() {
            for i in $(seq 1 40); do
              tmo 30 xcrun simctl io "$UDID" screenshot --type=jpeg "$RUNNER_TEMP/probe.jpg" >/dev/null 2>&1
              [ "$(stat -f%z "$RUNNER_TEMP/probe.jpg" 2>/dev/null || echo 0)" -gt 150000 ] && return 0
              sleep 3
            done
            return 1
          }
          # server-side proof of a sign-in: the credentials provider stamps
          # User.lastAuthenticatedAt, which the seed leaves empty
          signed_in() {
            [ "$($PSQL -c "select count(*) from \"User\" where email='$PROBE_EMAIL' and \"lastAuthenticatedAt\" is not null")" = "1" ]
          }
          OK=0
          for attempt in 1 2 3 4; do
            echo "=== sign-in attempt $attempt"
            $PSQL -c "update \"User\" set \"lastAuthenticatedAt\"=null where email='$PROBE_EMAIL'"
            [ "$attempt" = 1 ] && { tmo 60 xcrun simctl launch "$UDID" com.apple.mobilesafari || true; sleep 15; }
            # the first touch after a boot is swallowed (seen in a typing test):
            # spend it on a throwaway load of the same page
            openurl "$HOST/auth/signin?warm=$attempt"
            loaded || echo "warm-up page did not paint"
            tmo 120 python3 .github/safari/ui.py tapxy 201 250
            sleep 10
            openurl "$HOST/auth/signin"
            sleep 5
            loaded || echo "sign-in page did not paint"
            sleep 3
            tmo 30 xcrun simctl io "$UDID" screenshot "shots/00-signin-$attempt.png"
            tmo 420 python3 .github/safari/ui.py signin "$PROBE_EMAIL" "$PROBE_PASSWORD"
            for i in $(seq 1 18); do signed_in && { OK=1; break; }; sleep 5; done
            tmo 30 xcrun simctl io "$UDID" screenshot "shots/00-after-signin-$attempt.png"
            [ "$OK" = 1 ] && break
            echo "attempt $attempt: the server saw no sign-in"
            tail -n 15 "$RUNNER_TEMP/next.log"
          done
          if [ "$OK" != 1 ]; then
            python3 .github/safari/ui.py dump > debug/after-signin-describe.json || true
            echo "::error::Could not sign in through the form after 4 attempts; the screens would be sign-in pages"
            exit 1
          fi
          echo "signed in on attempt $attempt"
          # let the app load past the sign-in redirect on the one host
          openurl "$HOST/today"
          loaded || true
          sleep 5
          cp "shots/00-after-signin-$attempt.png" shots/00-after-signin.png
          python3 .github/safari/ui.py dump > debug/after-signin-describe.json || true

      - name: Rows for the scroll scenarios
        run: npx tsx .github/safari/seed-tasks.ts

      - name: Scenarios, light and dark
        timeout-minutes: 25
        run: |
          set -uo pipefail
          . .github/safari/lib.sh   # tmo, say, run, shot, open_url: every call under a timeout, logged
          open_path() {
            curl -fsS -m 20 -o /dev/null http://127.0.0.1:3000/auth/signin || { echo "SERVER DOWN before $1"; tail -n 30 "$RUNNER_TEMP/next.log"; }
            open_url "http://127.0.0.1:3000$1"
            sleep 3
          }
          up() { run $((60 + 30 * $1)) "scroll up $1" python3 .github/safari/ui.py up "$1"; }
          for theme in light dark; do
            run 60 "appearance $theme" xcrun simctl ui "$UDID" appearance "$theme"
            sleep 2
            open_path /today;               shot "$theme-01-today-top"
            up 2; sleep 1; shot "$theme-02-today-scrolled"
            open_path /tasks;               shot "$theme-03-tasks-top"
            up 12; sleep 1; shot "$theme-04-tasks-bottom"
            open_path "/settings#appearance"; shot "$theme-05-settings-sheet"
            open_path /tasks
            up 1; sleep 1; shot "$theme-06-tasks-mid"
          done
        # a scenario that goes wrong must not hide the shots already taken
        continue-on-error: true

      # The phone Focus button (additions-2/focus-done, fd-): drawn only while a
      # session runs. The shots above are the idle state (no button); these are
      # running, paused and ending, light and dark.
      - name: Focus button states
        timeout-minutes: 20
        run: |
          set -uo pipefail
          . .github/safari/lib.sh   # tmo, say, run, shot, open_url: every call under a timeout, logged
          open_path() { open_url "http://127.0.0.1:3000$1"; sleep 3; }
          # the fog dots drift (1.2 px/s): two shots 8 s apart must differ
          tmo 120 npx tsx .github/safari/seed-focus.ts none
          run 60 "appearance light" xcrun simctl ui "$UDID" appearance light
          open_path /today
          shot 08-fog-a
          sleep 8
          shot 08-fog-b
          if cmp -s shots/08-fog-a.png shots/08-fog-b.png; then echo "FOG DOTS STILL"; else echo "fog dots move"; fi
          for state in running paused ending; do
            for theme in light dark; do
              run 60 "appearance $theme" xcrun simctl ui "$UDID" appearance "$theme"
              sleep 2
              # a slow first load can outlive the 2-minute ending window: warm
              # the page, then seed and load it again right before the shot
              open_path /today
              tmo 120 npx tsx .github/safari/seed-focus.ts "$state"
              open_path /today
              sleep 2
              shot "$theme-07-focus-$state"
            done
          done
          tmo 120 npx tsx .github/safari/seed-focus.ts none
        continue-on-error: true

      # Pixel checks on the shots (web content is not in the accessibility
      # tree). The focus row (additions-2/focus-done .fd-dockrow): the button
      # fully on screen and apart from the pill, no New task. The top 4 pt of
      # every shot: no sharp list text (page ground, or blurred). The focus
      # verdict is over the rows of the dock, not one pixel row: the fog dots
      # under the dock close the gap on single rows. The self-test runs the
      # check on synthetic docks first (dots bridging passes, a real overlap fails).
      - name: Check the focus row and the top edge
        id: pixels
        # run here, ahead of the long layout and installed-app steps, which a
        # stalled simulator can cut short; judged in the last step below
        continue-on-error: true
        run: |
          set -uo pipefail
          rc=0
          python3 -I .github/safari/check-shots.py selftest || rc=1
          python3 -I .github/safari/check-shots.py focus shots/*-07-focus-*.png || rc=1
          python3 -I .github/safari/check-shots.py edge shots/light-0[1-7]-*.png shots/dark-0[1-7]-*.png || rc=1
          exit $rc

      # Safari's three tab-bar layouts (Settings > Apps > Safari > Tabs). The
      # scenarios above run in the default, Compact. Per layout: the viewport
      # numbers and data-safari-bar from the app's own pre-paint script
      # (viewport.html runs VIEWPORT_BOOT_SCRIPT), then the app at rest and
      # scrolled. The dock is lifted only with the bar at the bottom. Compact
      # is set back at the end: the install below drives Compact's menu.
      # One step per phase, each followed by an upload that runs even when the
      # step stalls or times out (.github/safari/layouts.sh: every simctl / idb
      # call under a timeout, every action timestamped into debug/layouts.log,
      # machine load sampled into debug/load.log). A phase that hangs leaves every
      # earlier phase's shots and the log.
      - name: Safari layouts, prepare
        timeout-minutes: 10
        run: bash .github/safari/layouts.sh prepare
        continue-on-error: true

      - name: Safari layouts, compact viewport
        timeout-minutes: 10
        run: bash .github/safari/layouts.sh shots compact viewport
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-compact-viewport
          path: |
            shots/layout-compact-00*
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, compact today
        timeout-minutes: 10
        run: bash .github/safari/layouts.sh shots compact today
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-compact-today
          path: |
            shots/layout-compact-01*
            shots/layout-compact-02*
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, compact tasks
        timeout-minutes: 10
        run: bash .github/safari/layouts.sh shots compact tasks
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-compact-tasks
          path: |
            shots/layout-compact-04*
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, set top
        timeout-minutes: 12
        run: bash .github/safari/layouts.sh set top
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-top-set
          path: |
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, top viewport
        timeout-minutes: 10
        run: bash .github/safari/layouts.sh shots top viewport
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-top-viewport
          path: |
            shots/layout-top-00*
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, top today
        timeout-minutes: 10
        run: bash .github/safari/layouts.sh shots top today
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-top-today
          path: |
            shots/layout-top-01*
            shots/layout-top-02*
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, top tasks
        timeout-minutes: 10
        run: bash .github/safari/layouts.sh shots top tasks
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-top-tasks
          path: |
            shots/layout-top-04*
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, set bottom
        timeout-minutes: 12
        run: bash .github/safari/layouts.sh set bottom
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-bottom-set
          path: |
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, bottom viewport
        timeout-minutes: 10
        run: bash .github/safari/layouts.sh shots bottom viewport
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-bottom-viewport
          path: |
            shots/layout-bottom-00*
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, bottom today
        timeout-minutes: 10
        run: bash .github/safari/layouts.sh shots bottom today
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-bottom-today
          path: |
            shots/layout-bottom-01*
            shots/layout-bottom-02*
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, bottom tasks
        timeout-minutes: 10
        run: bash .github/safari/layouts.sh shots bottom tasks
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-bottom-tasks
          path: |
            shots/layout-bottom-04*
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      - name: Safari layouts, Compact back + verdict
        timeout-minutes: 12
        run: bash .github/safari/layouts.sh finish
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-layouts-summary
          path: |
            shots/layouts-summary.txt
            debug/layouts.log
            debug/layout-*
            debug/viewport*
            debug/load.log
          if-no-files-found: warn

      # The installed app (Add to Home Screen, standalone). The owner's bands,
      # the Safari controls after leaving Home and the top band show there, not
      # in a tab: in a tab `top: 0` sits 62 px under the status bar.
      - name: Install the app to the Home Screen
        if: ${{ !inputs.quick }}
        timeout-minutes: 15
        run: python3 .github/safari/standalone.py install
        continue-on-error: true

      - name: Sign in inside the installed app
        if: ${{ !inputs.quick }}
        timeout-minutes: 20
        run: python3 .github/safari/standalone.py signin "$PROBE_EMAIL" "$PROBE_PASSWORD"
        continue-on-error: true

      # nav first: the scenarios seed a Focus session, whose end would open
      # the session-complete sheet in the middle of the walk
      - name: Installed app, Home > Tasks > a doc > Settings > back
        if: ${{ !inputs.quick }}
        timeout-minutes: 15
        run: python3 .github/safari/standalone.py nav
        continue-on-error: true

      - name: Installed app, scenarios light and dark
        if: ${{ !inputs.quick }}
        timeout-minutes: 30
        run: python3 .github/safari/standalone.py scenarios
        continue-on-error: true

      - name: Keep the server log
        if: always()
        run: cp "$RUNNER_TEMP/next.log" next.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: safari-phone-shots
          path: |
            shots
            debug
            next.log
          if-no-files-found: warn

      - name: Server log
        if: always()
        run: tail -n 60 "$RUNNER_TEMP/next.log" || true

      # Last, so every shot is uploaded first: an edge band or Safari's chrome
      # in the installed app fails the run, with what was measured.
      - name: Installed app verdict
        if: always()
        run: |
          cat shots/standalone-report.txt 2>/dev/null || true
          cat debug/install-head.txt 2>/dev/null || true
          if [ "${{ steps.pixels.outcome }}" != "success" ]; then
            echo "::error::The pixel checks on the shots failed (step: Check the focus row and the top edge)"; exit 1
          fi
          if [ "${{ steps.head.outcome }}" != "success" ]; then
            echo "::error::The install tags are not in <head> of every route, or a redirect leaves 127.0.0.1 (debug/install-head.txt)"; exit 1
          fi
          if [ "${{ inputs.quick }}" = "true" ]; then exit 0; fi
          if [ ! -s debug/standalone-method.txt ] || [ "$(head -1 debug/standalone-method.txt)" = "None" ]; then
            echo "::error::The app could not be installed to the Home Screen"; exit 1
          fi
          if [ -s debug/standalone-problems.txt ]; then
            while read -r l; do echo "::error::$l"; done < debug/standalone-problems.txt
            exit 1
          fi
