name: Landing SEO

# Every URL in landing-site/sitemap.xml must be a page worth indexing: it exists
# as <path>/index.html, has no noindex, and its canonical is itself. Every
# internal link must point straight at a file, so none needs a redirect.
# Runs against the files nginx serves, so it needs no network.

on:
  pull_request:
    paths:
      - "landing-site/**"
      - "scripts/seo/**"
      - ".github/workflows/landing-seo.yml"
  push:
    branches: [landing]
    paths:
      - "landing-site/**"
      - "scripts/seo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            landing-site
            scripts/seo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check the sitemap and internal links
        run: node scripts/seo/check-sitemap.mjs --dir landing-site --base https://needt.app
