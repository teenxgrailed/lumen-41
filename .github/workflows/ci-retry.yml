name: CI retry on main

# A main CI run that fails or times out on infrastructure (a stalled apt
# mirror, a runner that never reaches the test server) used to leave
# production unpublished until someone ran `gh run rerun --failed` by hand.
# This reruns the failed jobs of a main run exactly once. A real regression
# fails the second attempt too and stays red.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Rerun failed jobs once
        run: gh run rerun "$RUN_ID" --failed
      - name: Wait for the second attempt
        id: wait
        run: |
          sleep 30
          if gh run watch "$RUN_ID" --exit-status --interval 60 >/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Second attempt failed too; leaving main red." >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      # A rerun started with GITHUB_TOKEN may not raise workflow_run for the
      # publish workflow. If no publish run for this SHA started after the
      # rerun succeeded, dispatch one (dispatch is allowed with GITHUB_TOKEN).
      - name: Make sure the release follows
        if: steps.wait.outputs.ok == 'true'
        run: |
          sleep 120
          head=$(gh api "repos/$GH_REPO/commits/main" -q .sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "main moved to $head; its own CI run publishes."
            exit 0
          fi
          since=$(gh run view "$RUN_ID" --json updatedAt -q .updatedAt)
          started=$(gh run list -w docker-publish.yml -L 10 \
            --json createdAt \
            -q "[.[] | select(.createdAt >= \"$since\")] | length")
          if [ "${started:-0}" -gt 0 ]; then
            echo "Publish already started."
          else
            gh workflow run docker-publish.yml --ref main
            echo "Dispatched publish for $HEAD_SHA."
          fi
