name: CI

on:
  push:
    # The merge queue builds gh-readonly-queue/* branches and reports through
    # merge_group below; a push run on the same commit would only duplicate it.
    branches-ignore:
      - "gh-readonly-queue/**"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to create from origin/main with Linux baselines only
        required: true
        default: codex/linux-visual-baselines
        type: string

concurrency:
  group: needt-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: postgresql://needt:needt@localhost:5432/needt_test
  DIRECT_URL: postgresql://needt:needt@localhost:5432/needt_test
  SHADOW_DATABASE_URL: postgresql://needt:needt@localhost:5432/needt_shadow
  REDIS_URL: redis://localhost:6379
  NEXTAUTH_URL: http://127.0.0.1:3000
  NEXTAUTH_SECRET: needt-ci-only-secret-not-valid-outside-github-actions
  RATE_LIMIT_HASH_SECRET: needt-ci-rate-limit-hash-secret

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A merge-queue group is the last gate before main: run the visual
      # suites in full instead of diffing paths against a queue base.
      ui: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'merge_group'
        id: filter
        with:
          filters: |
            ui:
              - "src/app/**/*.tsx"
              - "src/app/**/*.css"
              - "src/components/**"
              - "design-refs/**"
              - "tailwind.config.*"
              - "tests/visual/**"
              - ".github/workflows/ci.yml"

  security:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch main baseline
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install semgrep==1.172.0
      # Only findings new since the merge base. A full scan (tried 2026-10-23)
      # reports 28 existing findings: Dockerfile without USER, unpinned
      # first-party action tags, .npmrc without min-release-age, and audit
      # rules in mail/task-format code and tests. Clear those before dropping
      # --baseline-commit.
      - name: Scan for new security findings
        run: |
          BASE_SHA=$(git merge-base origin/main HEAD)
          semgrep --config=auto --error --baseline-commit "$BASE_SHA"

  supply-chain:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # npm audit --omit=dev --audit-level=high, minus the accepted advisories
      # in .github/npm-audit-allowlist.json (each with a reason and a date).
      - name: Audit production dependencies
        run: node scripts/check-npm-audit.mjs
      - name: Scan the pull request's commits for secrets
        if: (success() || failure()) && github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  quality-gates:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: needt
          POSTGRES_PASSWORD: needt
          POSTGRES_DB: needt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needt -d needt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fail when a PR edits CHANGELOG.md directly
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | {filename, status, patch} | tojson' > "$RUNNER_TEMP/pr-files.ndjson"
          gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[].commit.message | split("\n")[0]' > "$RUNNER_TEMP/pr-subjects.txt"
          node scripts/check-changelog-edit.mjs \
            --pr-files "$RUNNER_TEMP/pr-files.ndjson" \
            --subjects "$RUNNER_TEMP/pr-subjects.txt"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/ci-seed.ts
      - run: npm run type-check
        env:
          # tsc hit the default ~2 GB heap and died with exit 134 on main.
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run lint
      - run: npm run check:branding
      - run: npm run check:ui-contracts
      - run: npm run check:worker-bundle
      - run: npm run test:unit -- --runInBand
        env:
          LIFETIME_CAP_INTEGRATION: "1"
          TRIAL_INTEGRATION: "1"
          PAGE_TRASH_INTEGRATION: "1"
          OAUTH_INTEGRATION: "1"
          SANDBOX_INTEGRATION: "1"
      - run: npm run build:collaboration
      - run: npm run check:collaboration-runtime

  schema-drift:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: needt
          POSTGRES_PASSWORD: needt
          POSTGRES_DB: needt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needt -d needt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Create shadow database
        run: PGPASSWORD=needt psql -h localhost -U needt -d needt_test -c 'CREATE DATABASE needt_shadow'
      - name: Check migration/schema drift
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

  e2e:
    if: github.event_name != 'workflow_dispatch'
    needs: [quality-gates, schema-drift]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: needt
          POSTGRES_PASSWORD: needt
          POSTGRES_DB: needt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needt -d needt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/ci-seed.ts
      - run: npx playwright install --with-deps
      - name: Build E2E application
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
      - name: Run E2E and collaboration authorization smoke
        env:
          NEEDT_E2E_PRODUCTION_SERVER: "1"
        run: npm run test:e2e
      - name: Upload task-completion motion frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: completion-frames
          path: test-results/completion-frames
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-swift-shell-shots
          path: desktop-shots
          if-no-files-found: ignore
      # Always: the onboarding spec attaches a screenshot of every screen
      # (desktop and phone) for visual review, not only on failure.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report
            test-results

  update-linux-visual-baselines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: needt
          POSTGRES_PASSWORD: needt
          POSTGRES_DB: needt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needt -d needt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Verify the dispatch ref contains fresh main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "Dispatch ref is behind origin/main; rebase it before generating baselines." >&2
            exit 1
          }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma generate && npx prisma migrate deploy
      - name: Build visual test application
        # Cold build with no .next/cache restore; the default heap OOMs here.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
      - name: Update Linux visual baselines
        env:
          NEEDT_VISUAL_PRODUCTION_SERVER: "1"
        run: npm run test:visual:update
      - name: Commit Linux baselines on a clean main branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            ""|main|master)
              echo "Target must be a non-default codex/* branch." >&2
              exit 1
              ;;
            codex/*) ;;
            *)
              echo "Target must use the codex/* prefix." >&2
              exit 1
              ;;
          esac
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null

          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Remote branch $TARGET_BRANCH already exists; choose a new target_branch." >&2
            exit 1
          fi

          git status --porcelain --untracked-files=all | while IFS= read -r entry; do
            path="${entry:3}"
            case "$path" in
              tests/visual/*-snapshots/*-linux.png) ;;
              *)
                echo "Baseline update touched forbidden path: $path" >&2
                exit 1
                ;;
            esac
          done

          # The guard above leaves only baseline PNGs modified or untracked.
          # Carry them across the switch by hand: when the dispatch ref already
          # committed baselines of its own, git refuses to switch a tracked file
          # that differs between the two commits, and the whole job dies after
          # the suite has already run.
          parked="$(mktemp -d)"
          git status --porcelain --untracked-files=all \
            -- ':(glob)tests/visual/**/*-linux.png' \
            | cut -c4- > "$parked/list"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "$parked/files/$(dirname "$path")"
            cp "$path" "$parked/files/$path"
          done < "$parked/list"
          git checkout -- tests/visual
          git clean -fdq -- tests/visual

          git switch --create "$TARGET_BRANCH" origin/main

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "$(dirname "$path")"
            cp "$parked/files/$path" "$path"
          done < "$parked/list"
          git add -- ':(glob)tests/visual/**/*-linux.png'

          if git diff --cached --quiet; then
            echo "Linux baselines already match; nothing to commit."
            exit 0
          fi

          changed_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The tree was just switched to origin/main, but .next/types still
          # holds stubs generated from the dispatch ref. On a branch that adds
          # routes those stubs point at files main does not have, so the repo
          # pre-commit hook's type-check fails on a commit of PNGs alone.
          git commit --no-verify -m "test(visual): refresh Linux baselines"
          git push --set-upstream origin "$TARGET_BRANCH"
          echo "Updated $changed_count CI-authoritative Linux baseline files." >> "$GITHUB_STEP_SUMMARY"

  # Each shard has its own Postgres service and so its own database; the
  # visual suites reset one shared fixture user, so shards must never share
  # a database and workers stay at 1 inside a shard.
  visual-style-shard:
    name: visual-style-shard (${{ matrix.shard }})
    if: github.event_name != 'workflow_dispatch'
    needs: [changes, quality-gates]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: needt
          POSTGRES_PASSWORD: needt
          POSTGRES_DB: needt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needt -d needt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: needs.changes.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: needs.changes.outputs.ui == 'true'
        run: npm ci
      - if: needs.changes.outputs.ui == 'true'
        run: npx playwright install --with-deps
      - if: needs.changes.outputs.ui == 'true'
        run: npx prisma generate && npx prisma migrate deploy
      - name: Cache Next.js build
        if: needs.changes.outputs.ui == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/schema.prisma', 'next.config.js') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build visual test application
        if: needs.changes.outputs.ui == 'true'
        run: npm run build
      - name: Run visual and style suites
        id: visual
        if: needs.changes.outputs.ui == 'true'
        continue-on-error: true
        env:
          NEEDT_VISUAL_PRODUCTION_SERVER: "1"
          SHARD: ${{ matrix.shard }}
        run: npm run test:visual -- --shard="$SHARD" && npm run test:style -- --shard="$SHARD"
      - name: Generate Linux baseline candidates
        id: baseline-candidates
        if: needs.changes.outputs.ui == 'true' && steps.visual.outcome == 'failure'
        continue-on-error: true
        env:
          NEEDT_VISUAL_PRODUCTION_SERVER: "1"
        run: npm run test:visual:update -- --last-failed
      - name: Upload visual failure report
        if: always() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-visual-report-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
      - name: Upload Linux baseline candidates
        if: always() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baseline-candidates-${{ strategy.job-index }}
          path: tests/visual/*-snapshots
      - name: Enforce visual gate
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1

  # Single required check: branch protection keeps matching `visual-style`.
  visual-style:
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [visual-style-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every visual shard
        env:
          RESULT: ${{ needs.visual-style-shard.result }}
        run: |
          result="$RESULT"
          echo "visual-style-shard: $result"
          [ "$result" = "success" ] || exit 1
