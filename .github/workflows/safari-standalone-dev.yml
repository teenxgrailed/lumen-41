name: TEMP standalone dev

# Temporary: proves Add to Home Screen, the standalone launch and the Web
# Inspector reader on a static page before they go into safari-phone.yml.
on:
  push:
    branches:
      - "ci/safari-standalone"
    paths:
      - ".github/safari/**"
      - ".github/workflows/safari-standalone-dev.yml"

jobs:
  dev:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install idb
        run: |
          set -euo pipefail
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion
          brew install python@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$HOME/idbenv"
          "$HOME/idbenv/bin/pip" install fb-idb pillow
          echo "$HOME/idbenv/bin" >> "$GITHUB_PATH"

      - name: Boot an iPhone simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json"
          read -r RUNTIME DEVTYPE <<< "$(python3 - "$RUNNER_TEMP/runtimes.json" <<'PY'
          import json, re, sys
          rts = [r for r in json.load(open(sys.argv[1]))["runtimes"]
                 if r.get("platform") == "iOS" and r.get("isAvailable", True)]
          rts.sort(key=lambda r: [int(p) for p in re.findall(r"\d+", r["version"])])
          rt = rts[-1]
          best = None
          for d in rt["supportedDeviceTypes"]:
              m = re.fullmatch(r"iPhone (\d+) Pro", d["name"])
              if m and (best is None or int(m.group(1)) > best[0]):
                  best = (int(m.group(1)), d["identifier"])
          print(rt["identifier"], best[1])
          PY
          )"
          echo "runtime=$RUNTIME devtype=$DEVTYPE"
          UDID="$(xcrun simctl create probe "$DEVTYPE" "$RUNTIME")"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          tmo() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          for i in 1 2 3; do
            xcrun simctl boot "$UDID" || true
            tmo 300 xcrun simctl bootstatus "$UDID" -b && break
            xcrun simctl shutdown "$UDID" || true
          done
          xcrun simctl ui "$UDID" appearance light
          (idb_companion --udid "$UDID" --grpc-port 10882 > "$RUNNER_TEMP/companion.log" 2>&1 &)
          for i in $(seq 1 12); do
            sleep 5
            tmo 30 idb connect localhost 10882 && break
          done

      - name: Static site
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/site"; mkdir -p "$S"
          cp public/icons/apple-touch-icon.png "$S/icon.png"
          head='<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Probe"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.png">'
          css='<style>html,body{margin:0;min-height:100%}a{position:absolute;left:20px;right:20px;height:100px;display:block;background:#c33;color:#fff;font:30px sans-serif}</style>'
          echo "<!doctype html><html style='background:#f6f6f3'><head>$head<title>Probe</title>$css</head><body><a id=in href=/b.html style=top:300px>in scope</a><a id=out href=http://localhost:3000/b.html style=top:500px>out of scope</a></body></html>" > "$S/index.html"
          echo "<!doctype html><html style='background:#141416'><head>$head<title>B</title>$css</head><body><a id=back href=/ style=top:300px>home</a></body></html>" > "$S/b.html"
          echo '{"name":"Probe","short_name":"Probe","start_url":"/","scope":"/","display":"standalone","background_color":"#f6f6f3","icons":[{"src":"/icon.png","sizes":"180x180","type":"image/png"}]}' > "$S/manifest.json"
          nohup python3 -m http.server 3000 --bind 127.0.0.1 -d "$S" > "$RUNNER_TEMP/http.log" 2>&1 < /dev/null &
          sleep 2; curl -fsS http://127.0.0.1:3000/ | head -c 200

      - name: Safari, then Add to Home Screen
        timeout-minutes: 15
        run: |
          set +e -x
          export WI_TRACE=1
          mkdir -p debug
          xcrun simctl launch "$UDID" com.apple.mobilesafari; sleep 15
          xcrun simctl openurl "$UDID" http://127.0.0.1:3000/; sleep 20
          xcrun simctl io "$UDID" screenshot debug/safari.png
          xcrun simctl getenv "$UDID" RWI_LISTEN_SOCKET || true
          python3 .github/safari/wi.py pages > debug/wi-pages-safari.json; cat debug/wi-pages-safari.json | head -80
          python3 .github/safari/wi.py eval --safari 'return {st: navigator.standalone, ih: innerHeight, sh: screen.height, url: location.href, r: document.getElementById("in").getBoundingClientRect().toJSON()}'
          python3 .github/safari/ui.py a2hs; echo "a2hs exit $?"
          unset WI_TRACE
          python3 .github/safari/ui.py launch Probe; echo "launch exit $?"
          sleep 5
          python3 .github/safari/ui.py front
          xcrun simctl io "$UDID" screenshot debug/standalone-0.png
          export WI_TRACE=1
          python3 .github/safari/wi.py pages > debug/wi-pages-standalone.json; head -80 debug/wi-pages-standalone.json
          python3 .github/safari/wi.py eval --webapp 'return {st: navigator.standalone, ih: innerHeight, iw: innerWidth, sh: screen.height, url: location.href, r: document.getElementById("in").getBoundingClientRect().toJSON(), dm: matchMedia("(display-mode: standalone)").matches}'
          python3 .github/safari/ui.py labels standalone-0
          python3 .github/safari/ui.py tapxy 200 350; sleep 6
          xcrun simctl io "$UDID" screenshot debug/standalone-1-in.png
          python3 .github/safari/wi.py eval --webapp 'return {st: navigator.standalone, ih: innerHeight, url: location.href}'
          python3 .github/safari/ui.py labels standalone-1
          python3 .github/safari/ui.py tapxy 200 350; sleep 6
          python3 .github/safari/ui.py tapxy 200 550; sleep 8
          xcrun simctl io "$UDID" screenshot debug/standalone-2-out.png
          python3 .github/safari/ui.py labels standalone-2
          python3 .github/safari/wi.py pages > debug/wi-pages-out.json; head -80 debug/wi-pages-out.json
          python3 .github/safari/wi.py eval --url localhost 'return {st: navigator.standalone, ih: innerHeight, url: location.href}'
        continue-on-error: true

      - name: Web Clip fallback
        timeout-minutes: 10
        run: |
          set +e -x
          python3 .github/safari/ui.py webclip ClipB http://127.0.0.1:3000/b.html public/icons/apple-touch-icon.png
          python3 .github/safari/ui.py launch ClipB; echo "launch exit $?"
          sleep 5
          python3 .github/safari/ui.py front
          xcrun simctl io "$UDID" screenshot debug/clip-0.png
          python3 .github/safari/ui.py labels clip-0
          python3 .github/safari/wi.py eval --webapp --url b.html 'return {st: navigator.standalone, ih: innerHeight, url: location.href}'
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: standalone-dev
          path: debug
