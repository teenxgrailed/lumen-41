name: ios-archive

# Proves the iOS app (apps/ios) can be archived for the App Store and that the
# archive holds what App Store Connect validates: the widget and share
# extensions, a privacy manifest in every bundle, the Info.plist keys, the
# App Shortcuts metadata. Nothing here is signed and no Apple Developer account
# is needed. The owner only adds a Team ID, signs, uploads and submits (see
# "Store readiness" in apps/ios/README.md).
#
# `xcodebuild -exportArchive` cannot finish without a distribution certificate,
# so it runs here only to prove ExportOptions-AppStore.plist is read by the real
# tool; scripts/check-export-log.sh asserts it fails for signing and nothing
# else. The unsigned .xcarchive is kept as the `needt-ios-archive` artifact.

on:
  push:
    paths:
      - "apps/ios/**"
      - "apps/shared/**"
      - ".github/workflows/ios-archive.yml"
  workflow_dispatch:

concurrency:
  group: ios-archive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/ios/package-lock.json

      - name: Static store-readiness checks
        run: scripts/check-static.sh

      - name: Install Capacitor packages
        run: npm ci

      - name: Sync native project
        run: npx cap sync ios

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            apps/ios/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/package-lock.json', 'apps/shared/*/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Xcode version
        run: xcodebuild -version

      - name: Archive (Release, unsigned)
        run: |
          set -o pipefail
          mkdir -p build out
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Needt.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > build/archive.log 2>&1 || { tail -n 150 build/archive.log; exit 1; }
          tail -n 25 build/archive.log

      - name: Archive holds the app, both extensions, manifests and plist keys
        run: scripts/verify-archive.sh build/Needt.xcarchive

      - name: exportArchive with ExportOptions-AppStore.plist (stops at signing)
        run: |
          set +e
          xcodebuild -exportArchive \
            -archivePath build/Needt.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions-AppStore.plist \
            > build/export.log 2>&1
          code=$?
          set -e
          cat build/export.log
          echo "exportArchive exit code: $code"
          scripts/check-export-log.sh build/export.log "$code"

      - name: Zip the archive
        if: always()
        run: |
          if [ -d build/Needt.xcarchive ]; then
            ditto -c -k --sequesterRsrc --keepParent build/Needt.xcarchive out/Needt.xcarchive.zip
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: needt-ios-archive
          path: |
            apps/ios/out/Needt.xcarchive.zip
            apps/ios/build/archive.log
            apps/ios/build/export.log
          if-no-files-found: warn
