name: macOS

# Unsigned builds of the native Mac app (apps/macos, SwiftUI/AppKit around a
# WKWebView, with the notch island compiled in from apps/macos/Island) and a
# test run of the shared Swift package (apps/shared/NeedtKit).
# Two builds run side by side: Needt (direct download, full island, Sparkle)
# and NeedtAppStore (sandboxed, no private interfaces, no Sparkle), which is
# archived the way Xcode archives it (universal, Release) and the .xcarchive is
# uploaded as needt-macos-appstore-archive for the owner to sign and upload.
# A third build, NeedtAppStoreLite (the App Store build without the notch island,
# nothing compiled from apps/macos/Island), is archived by the appstore-lite job
# on pushes to main and on manual runs only: macOS minutes are expensive, and
# the default store build is NeedtAppStore.
# Not part of the release pipeline: nothing here signs, notarizes or publishes.
# The Windows app is still the Tauri one (desktop.yml).
on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "apps/shared/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "apps/shared/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:
    inputs:
      only_lite:
        description: "Run only the appstore-lite job (skip the direct build and the NeedtAppStore archive)"
        type: boolean
        default: false

concurrency:
  group: needt-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Needt.app (unsigned, direct)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_lite) }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Xcode version
        run: xcodebuild -version

      - name: NeedtKit tests
        working-directory: apps/shared/NeedtKit
        run: swift test

      # Regression guard for the "Update Constraints in Window" crash: every
      # hosting view in apps/macos must publish no size into its window, and no
      # SwiftUI scene (MenuBarExtra, Settings, WindowGroup) may exist.
      - name: Every hosting view has sizingOptions = [] and no SwiftUI scene exists
        working-directory: apps/macos
        run: python3 scripts/check-hosting-views.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/macos
        run: xcodegen generate

      - name: Build (no signing)
        working-directory: apps/macos
        run: |
          set -o pipefail
          xcodebuild \
            -project Needt.xcodeproj \
            -scheme Needt \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 80

      - name: Compiler errors
        if: failure()
        working-directory: apps/macos
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Entitlements and private APIs
        working-directory: apps/macos
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib, sys
          def load(name):
              with open(f"Generated/{name}.entitlements", "rb") as f:
                  return plistlib.load(f)
          failed = False
          for name in ("Needt", "NeedtAppStore", "NeedtShare", "NeedtWidgets"):
              e = load(name)
              print(name, sorted(e))
              need = ["com.apple.security.network.client",
                      "com.apple.security.application-groups"]
              # The direct build is unsandboxed on purpose (the full island).
              if name != "Needt":
                  need.append("com.apple.security.app-sandbox")
              if name not in ("NeedtShare", "NeedtWidgets"):
                  need.append("com.apple.security.files.user-selected.read-only")
              for key in need:
                  if not e.get(key):
                      print("missing", name, key); failed = True
              if not any("app.needt.mac" in g for g in e.get("com.apple.security.application-groups", [])):
                  print("no app group in", name); failed = True
          if "com.apple.security.temporary-exception.mach-lookup.global-name" in load("NeedtAppStore"):
              print("App Store entitlements carry a temporary exception"); failed = True
          sys.exit(1 if failed else 0)
          PY
          # No private API: no KVC into WebKit/AppKit internals, no private selectors by string.
          if grep -rnE 'drawsBackground|setValue\(.*forKey:|_setDrawsBackground|NSSelectorFromString|dlsym|objc_getClass' Needt Share Widgets; then
            echo "private API pattern found"; exit 1
          fi

      - name: Zip Needt.app
        working-directory: apps/macos
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/Needt.app
          test -d "$APP"
          plutil -p "$APP/Contents/Info.plist" | head -40
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/Needt-macos-unsigned.zip

      - name: Direct build embeds Sparkle and the Share extension
        working-directory: apps/macos
        run: |
          set -euo pipefail
          DIRECT=build/Build/Products/Release/Needt.app
          test -d "$DIRECT/Contents/PlugIns/NeedtShare.appex"
          test -d "$DIRECT/Contents/PlugIns/NeedtWidgets.appex"
          plutil -p "$DIRECT/Contents/PlugIns/NeedtWidgets.appex/Contents/Info.plist" | grep -E "com.apple.widgetkit-extension"
          test -d "$DIRECT/Contents/Frameworks/Sparkle.framework"
          # The island's GPL licence and acknowledgements ship in the app.
          test -f "$DIRECT/Contents/Resources/LICENSE.txt"
          test -f "$DIRECT/Contents/Resources/ACKNOWLEDGEMENTS.md"

      # The CI harness (apps/macos/CI, macos-webview.yml) is compiled only with
      # NEEDT_CI_CONDITION=NEEDT_CI; a build made the release way has none of it.
      - name: Release-style build has no CI harness
        working-directory: apps/macos
        run: |
          set -euo pipefail
          strings build/Build/Products/Release/Needt.app/Contents/MacOS/Needt > "$RUNNER_TEMP/direct-strings.txt"
          if grep -E -- "--ci-session-cookie|--ci-base-url|app\.needt\.mac\.ci" "$RUNNER_TEMP/direct-strings.txt"; then
            echo "The CI harness is compiled into the release-style build"; exit 1
          fi

      - name: Entitlements
        working-directory: apps/macos
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib, sys
          def load(name):
              with open(f"Generated/{name}.entitlements", "rb") as f:
                  return plistlib.load(f)
          failed = False
          for name in ("Needt", "NeedtAppStore", "NeedtShare", "NeedtWidgets"):
              e = load(name)
              print(name, sorted(e))
              # The direct build is unsandboxed on purpose (the full island);
              # the App Store build and the extension must be sandboxed.
              need = ["com.apple.security.network.client",
                      "com.apple.security.application-groups"]
              if name != "Needt":
                  need.append("com.apple.security.app-sandbox")
              if name not in ("NeedtShare", "NeedtWidgets"):
                  need.append("com.apple.security.files.user-selected.read-only")
              for key in need:
                  if not e.get(key):
                      print("missing", name, key); failed = True
              if not any("app.needt.mac" in g for g in e.get("com.apple.security.application-groups", [])):
                  print("no app group in", name); failed = True
          store = load("NeedtAppStore")
          if "com.apple.security.temporary-exception.mach-lookup.global-name" in store:
              print("App Store entitlements carry a temporary exception"); failed = True
          if "com.apple.security.cs.disable-library-validation" in store:
              print("App Store entitlements disable library validation"); failed = True
          sys.exit(1 if failed else 0)
          PY

      # Best effort: start the app for a few seconds and report whether it
      # stayed up. A runner has no signed-in person, so this shows the start
      # window; it proves the app launches, not that sign-in works.
      - name: Launch smoke test
        continue-on-error: true
        working-directory: apps/macos
        run: |
          set -u
          APP=build/Build/Products/Release/Needt.app
          mkdir -p out
          # Signed-in behaviour without an account: --ci-fixture-data feeds the
          # menu-bar item and the island tasks and a focus run that change every
          # 3 s, so the first-data-arrives path runs (the real-Mac crash).
          "$APP/Contents/MacOS/Needt" --ci-fixture-data > out/launch.log 2>&1 &
          PID=$!
          sleep 20
          screencapture -x out/needt-start-window.png || true
          if kill -0 "$PID" 2>/dev/null; then
            echo "Needt is running after 20 s (pid $PID)"
            kill "$PID" || true
          else
            echo "Needt exited early"
            cat out/launch.log
            exit 1
          fi
          STEPS=$(grep -c "^\[ci-fixture\] step" out/launch.log || true)
          echo "fixture updates applied: $STEPS"
          test "$STEPS" -ge 5

      # Draws every island v3 state once (ImageRenderer, fixture data, no
      # account, no window) so the result can be compared with the HTML lab
      # (additions-2/widgets/index.html). Not a gate: the app build is.
      - name: Render island states to PNG
        continue-on-error: true
        working-directory: apps/macos
        run: |
          set -u
          APP=build/Build/Products/Release/Needt.app
          mkdir -p out/island
          "$APP/Contents/MacOS/Needt" --render-island-states out/island > out/island-render.log 2>&1 || true
          tail -n 20 out/island-render.log
          ls out/island | wc -l

      # Soak: the app runs with fixture data (fake Pro, tasks and a focus run
      # that change every 3 s, menu-bar item and island fed) for minutes and
      # must not crash. The Update Constraints loop and a launch-time permission prompt
      # both showed up only on a real Mac, after a few seconds of running.
      - name: Signed-in soak with fixture data (v3 for 3 min, classic notch for 90 s)
        working-directory: apps/macos
        run: |
          set -u
          APP=build/Build/Products/Release/Needt.app
          REPORTS="$HOME/Library/Logs/DiagnosticReports"
          mkdir -p out "$REPORTS"
          ls "$REPORTS" > out/reports-before.txt 2>/dev/null || true
          defaults write app.needt.mac needtIslandEnabled -bool true
          run_soak() {
            NAME="$1"; SECONDS_TOTAL="$2"
            echo "== $NAME for ${SECONDS_TOTAL}s"
            "$APP/Contents/MacOS/Needt" --ci-fake-pro --ci-fixture-data > "out/soak-$NAME.log" 2>&1 &
            PID=$!
            ELAPSED=0
            while [ "$ELAPSED" -lt "$SECONDS_TOTAL" ]; do
              sleep 5; ELAPSED=$((ELAPSED + 5))
              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Needt exited after ${ELAPSED}s ($NAME)"; tail -n 40 "out/soak-$NAME.log"
                return 1
              fi
              if [ "$ELAPSED" -eq 30 ]; then screencapture -x "out/soak-$NAME-30s.png" || true; fi
            done
            screencapture -x "out/soak-$NAME-end.png" || true
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            # The fixture changes menu-bar and island data every 3 s: the
            # soak only means something if those updates really ran.
            STEPS=$(grep -c "^\[ci-fixture\] step" "out/soak-$NAME.log" || true)
            echo "$NAME: fixture updates applied: $STEPS"
            if [ "$STEPS" -lt $((SECONDS_TOTAL / 3 - 5)) ]; then
              echo "too few fixture updates ($NAME)"; return 1
            fi
            return 0
          }
          STATUS=0
          defaults write app.needt.mac needtIslandV3 -bool true
          run_soak v3 180 || STATUS=1
          defaults write app.needt.mac needtIslandV3 -bool false
          run_soak classic 90 || STATUS=1
          defaults delete app.needt.mac needtIslandV3 || true
          sleep 8
          ls "$REPORTS" > out/reports-after.txt 2>/dev/null || true
          NEW=$(comm -13 out/reports-before.txt out/reports-after.txt | grep -E "^Needt.*\.(ips|crash)$" || true)
          if [ -n "$NEW" ]; then
            echo "New crash reports:"; echo "$NEW"
            for f in $NEW; do cp "$REPORTS/$f" out/ || true; done
            STATUS=1
          fi
          # A permission prompt at launch is a defect: the first-use rule.
          if grep -iE "would like to access|TCC" out/soak-*.log; then
            echo "A permission request appeared in the app log"; STATUS=1
          fi
          exit "$STATUS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: needt-island-states
          path: |
            apps/macos/out/island/*.png
            apps/macos/out/island-render.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: needt-macos-unsigned
          path: |
            apps/macos/out/Needt-macos-unsigned.zip
            apps/macos/out/needt-start-window.png
            apps/macos/out/launch.log
            apps/macos/out/soak-*.log
            apps/macos/out/soak-*.png
            apps/macos/out/Needt*.ips
            apps/macos/out/Needt*.crash
            apps/macos/build.log
          if-no-files-found: warn

  appstore:
    name: Archive NeedtAppStore (unsigned, universal)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_lite) }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/macos
        run: xcodegen generate

      # xcodegen must leave a shared scheme for NeedtAppStore whose Archive
      # action builds Release: `xcodebuild archive -scheme NeedtAppStore`.
      - name: NeedtAppStore has a shared scheme with an Archive action
        working-directory: apps/macos
        run: |
          set -euo pipefail
          SCHEME=Needt.xcodeproj/xcshareddata/xcschemes/NeedtAppStore.xcscheme
          test -f "$SCHEME"
          grep -A3 "<ArchiveAction" "$SCHEME" | tee "$RUNNER_TEMP/archive-action.txt"
          grep -q 'buildConfiguration = "Release"' "$RUNNER_TEMP/archive-action.txt"

      # Runs before the build: it reads project.yml and the sources, so a
      # private interface, a missing privacy declaration or a bad plist fails
      # in seconds and does not need a compile to find.
      - name: No private interface in the sources compiled into NeedtAppStore
        working-directory: apps/macos
        run: python3 scripts/check-appstore-private-api.py

      - name: Property lists and privacy manifests are valid and match the sources
        working-directory: apps/macos
        run: |
          set -euo pipefail
          mkdir -p out
          plutil -lint ExportOptions-AppStore.plist Privacy/*/PrivacyInfo.xcprivacy \
            Generated/NeedtAppStore.entitlements Generated/NeedtShare.entitlements \
            Generated/NeedtWidgets.entitlements Generated/NeedtAppStore-Info.plist \
            Generated/NeedtShare-Info.plist Generated/NeedtWidgets-Info.plist
          python3 scripts/check-appstore-privacy.py --list out/island-sources-in-appstore.txt

      - name: Cache Swift packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: apps/macos/SourcePackages
          key: spm-macos-${{ hashFiles('apps/macos/project.yml', 'apps/shared/NeedtKit/Package.swift', 'apps/shared/NeedtWidgetKit/Package.swift') }}
          restore-keys: spm-macos-

      # The same archive the owner makes in Xcode (Product > Archive), minus
      # signing: both architectures, Release, the shared scheme.
      - name: Archive NeedtAppStore (no signing, arm64 + x86_64)
        working-directory: apps/macos
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Needt.xcodeproj \
            -scheme NeedtAppStore \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build-appstore/NeedtAppStore.xcarchive \
            -derivedDataPath build-appstore/derived \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build-appstore.log | tail -n 60

      - name: Compiler errors
        if: failure()
        working-directory: apps/macos
        run: grep -E "error:" build-appstore.log | sort -u | head -120 || true

      - name: Archive contents
        working-directory: apps/macos
        run: |
          set -euo pipefail
          ARCHIVE=build-appstore/NeedtAppStore.xcarchive
          APP="$ARCHIVE/Products/Applications/Needt.app"
          test -d "$APP"
          test -d "$APP/Contents/PlugIns/NeedtShare.appex"
          test -d "$APP/Contents/PlugIns/NeedtWidgets.appex"
          test -d "$ARCHIVE/dSYMs"
          plutil -p "$ARCHIVE/Info.plist"
          find "$ARCHIVE" -name PrivacyInfo.xcprivacy
          # Info.plist, entitlements, universal binaries, privacy manifests, icon.
          python3 scripts/check-appstore-bundle.py "$APP" Generated/NeedtAppStore.entitlements
          # What Xcode will sign with (informational: an unsigned build may not write it).
          find build-appstore/derived -name "*.xcent" | head -5 | while read -r f; do echo "$f"; plutil -p "$f"; done
          # No Sparkle, no private framework, no private interface named in the binary.
          if [ -e "$APP/Contents/Frameworks/Sparkle.framework" ]; then
            echo "Sparkle is inside the App Store build"; exit 1
          fi
          strings "$APP/Contents/MacOS/Needt" > "$RUNNER_TEMP/store-strings.txt"
          if grep -q "SPUStandardUpdaterController" "$RUNNER_TEMP/store-strings.txt"; then
            echo "Sparkle symbols are inside the App Store build"; exit 1
          fi
          otool -L "$APP/Contents/MacOS/Needt" | tee "$RUNNER_TEMP/store-libs.txt"
          if grep -q "PrivateFrameworks" "$RUNNER_TEMP/store-libs.txt"; then
            echo "The App Store binary links a private framework"; exit 1
          fi
          if grep -E "PrivateFrameworks|SkyLight|MediaRemote|IOReport|DisplayServices|CoreBrightness" "$RUNNER_TEMP/store-strings.txt" | head -20 | grep .; then
            echo "A private interface is named in the App Store binary"; exit 1
          fi
          # No upsell wording from the upstream island in the binary (App Review 3.1.1).
          if grep -E "Upgrade now|Buy us a coffee|Unlock advanced features" "$RUNNER_TEMP/store-strings.txt"; then
            echo "Purchase wording is inside the App Store build"; exit 1
          fi

      # Required Reason APIs in the resolved packages, next to what the app
      # declares. Information: each package carries its own manifest.
      - name: Required Reason APIs in the Swift packages
        if: ${{ !cancelled() }}
        working-directory: apps/macos
        run: python3 scripts/check-appstore-privacy.py --packages SourcePackages/checkouts | sed -n '/Swift packages/,$p'

      # The scripting-targets entitlement only works when the group names are
      # in the target app's scripting definition. Music.app is on the runner;
      # Spotify is installed from its cask for this check. If the cask cannot
      # be installed the step fails: an unverified group is a rejected upload.
      - name: Scripting access groups exist in Music.app and Spotify.app
        if: ${{ !cancelled() }}
        working-directory: apps/macos
        run: |
          set -u
          if ! brew install --cask spotify > "$RUNNER_TEMP/spotify-install.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/spotify-install.log"
            echo "::error::brew install --cask spotify failed; the Spotify scripting groups cannot be verified"
            exit 1
          fi
          python3 - <<'PY'
          import plistlib, re, subprocess, sys, os
          want = plistlib.load(open("Generated/NeedtAppStore.entitlements", "rb"))["com.apple.security.scripting-targets"]
          apps = {"com.apple.Music": "/System/Applications/Music.app", "com.spotify.client": "/Applications/Spotify.app"}
          failed = False
          for bundle, groups in want.items():
              path = apps[bundle]
              if not os.path.isdir(path):
                  print(f"::error::{path} is not installed on the runner; {bundle} groups {groups} are NOT verified")
                  failed = True
                  continue
              sdef = subprocess.run(["sdef", path], capture_output=True, text=True).stdout
              have = sorted(set(re.findall(r'access-group identifier="([^"]*)"', sdef)))
              print(bundle, "declares", have)
              # which scripting items each group covers (so the group is the right one)
              import xml.etree.ElementTree as ET
              try:
                  for el in ET.fromstring(sdef).iter():
                      for group in el.findall("access-group"):
                          print("   ", group.get("identifier"), "<-", el.tag, el.get("name") or el.get("code"))
              except ET.ParseError as error:
                  print("   sdef not parseable:", error)
              missing = [g for g in groups if g not in have]
              if missing:
                  print(f"::error::{bundle} declares no access group {missing}; the entitlement is invalid for it")
                  failed = True
              else:
                  print(f"{bundle}: {groups} verified in the scripting definition")
          sys.exit(1 if failed else 0)
          PY

      # Proves ExportOptions-AppStore.plist is read by xcodebuild. Signing
      # cannot work here (no team, certificate or account), so the export is
      # expected to fail, and only on signing or provisioning. An options
      # error (bad key or value) comes before that and fails this step.
      - name: Export options are accepted (fails only on signing)
        if: ${{ !cancelled() }}
        working-directory: apps/macos
        run: |
          set -u
          xcodebuild -exportArchive \
            -archivePath build-appstore/NeedtAppStore.xcarchive \
            -exportOptionsPlist ExportOptions-AppStore.plist \
            -exportPath out/export > out/export.log 2>&1 && STATUS=0 || STATUS=$?
          cat out/export.log
          echo "exportArchive exit status: $STATUS"
          if grep -iE "exportOptionsPlist error|unrecognized|unknown key|invalid (key|value|method)|expected one of|couldn.t be (opened|read)|not in the correct format" out/export.log; then
            echo "xcodebuild rejected ExportOptions-AppStore.plist"; exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            # Without a team the only expected errors are the two xcodebuild
            # prints for a missing certificate and a missing profile.
            EXPECTED='No signing certificate|No profiles for|No Accounts'
            if ! grep -E "error:" out/export.log | grep -E "$EXPECTED"; then
              echo "exportArchive failed for a reason that is not a missing certificate or profile"; exit 1
            fi
            if grep -E "error:" out/export.log | grep -vE "$EXPECTED"; then
              echo "exportArchive reported an error other than a missing certificate or profile"; exit 1
            fi
            echo "exportArchive failed only on the missing certificate and profile, as expected without a team"
          fi

      - name: Zip the archive
        if: ${{ !cancelled() }}
        working-directory: apps/macos
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build-appstore/NeedtAppStore.xcarchive out/NeedtAppStore.xcarchive.zip
          ls -lh out/NeedtAppStore.xcarchive.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: needt-macos-appstore-archive
          path: apps/macos/out/NeedtAppStore.xcarchive.zip
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: needt-macos-appstore-log
          path: |
            apps/macos/build-appstore.log
            apps/macos/out/export.log
            apps/macos/out/island-sources-in-appstore.txt
          if-no-files-found: warn

  # The App Store build without the island. Not on pull requests (a macOS run
  # costs real money, and the default store build is NeedtAppStore): on pushes
  # to main that touch apps/macos (the on.push paths above) and by hand.
  appstore-lite:
    name: Archive NeedtAppStoreLite (unsigned, universal, no island)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/macos
        run: xcodegen generate

      - name: NeedtAppStoreLite has a shared scheme with an Archive action
        working-directory: apps/macos
        run: |
          set -euo pipefail
          SCHEME=Needt.xcodeproj/xcshareddata/xcschemes/NeedtAppStoreLite.xcscheme
          test -f "$SCHEME"
          grep -A3 "<ArchiveAction" "$SCHEME" | tee "$RUNNER_TEMP/archive-action.txt"
          grep -q 'buildConfiguration = "Release"' "$RUNNER_TEMP/archive-action.txt"

      # Before the build, like the appstore job: these read project.yml and the
      # sources, so a private interface, a missing privacy declaration, an
      # island file or a bad plist fails in seconds.
      - name: Nothing from Island/ is listed or named in the Lite sources
        working-directory: apps/macos
        run: python3 scripts/check-lite-no-island.py --sources

      - name: No private interface in the sources compiled into NeedtAppStoreLite
        working-directory: apps/macos
        run: python3 scripts/check-appstore-private-api.py --variant lite

      - name: Every hosting view has sizingOptions = []
        working-directory: apps/macos
        run: python3 scripts/check-hosting-views.py

      - name: Property lists and privacy manifests are valid and match the sources
        working-directory: apps/macos
        run: |
          set -euo pipefail
          mkdir -p out
          plutil -lint Privacy/*/PrivacyInfo.xcprivacy \
            Generated/NeedtAppStoreLite.entitlements Generated/NeedtShare.entitlements \
            Generated/NeedtWidgets.entitlements Generated/NeedtAppStoreLite-Info.plist \
            Generated/NeedtShare-Info.plist Generated/NeedtWidgets-Info.plist
          python3 scripts/check-appstore-privacy.py --variant lite

      - name: Cache Swift packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: apps/macos/SourcePackages
          key: spm-macos-${{ hashFiles('apps/macos/project.yml', 'apps/shared/NeedtKit/Package.swift', 'apps/shared/NeedtWidgetKit/Package.swift') }}
          restore-keys: spm-macos-

      - name: Archive NeedtAppStoreLite (no signing, arm64 + x86_64)
        working-directory: apps/macos
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Needt.xcodeproj \
            -scheme NeedtAppStoreLite \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build-appstore-lite/NeedtAppStoreLite.xcarchive \
            -derivedDataPath build-appstore-lite/derived \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build-appstore-lite.log | tail -n 60

      - name: Compiler errors
        if: failure()
        working-directory: apps/macos
        run: grep -E "error:" build-appstore-lite.log | sort -u | head -120 || true

      - name: Archive contents
        working-directory: apps/macos
        run: |
          set -euo pipefail
          ARCHIVE=build-appstore-lite/NeedtAppStoreLite.xcarchive
          APP="$ARCHIVE/Products/Applications/Needt.app"
          test -d "$APP"
          test -d "$APP/Contents/PlugIns/NeedtShare.appex"
          test -d "$APP/Contents/PlugIns/NeedtWidgets.appex"
          test -d "$ARCHIVE/dSYMs"
          plutil -p "$ARCHIVE/Info.plist"
          find "$ARCHIVE" -name PrivacyInfo.xcprivacy
          # Info.plist, entitlements (the shorter Lite lists), universal binaries, privacy manifests, icon.
          python3 scripts/check-appstore-bundle.py --variant lite "$APP" Generated/NeedtAppStoreLite.entitlements
          find build-appstore-lite/derived -name "*.xcent" | head -5 | while read -r f; do echo "$f"; plutil -p "$f"; done
          # No Sparkle, no private framework, no private interface named in the binary.
          if [ -e "$APP/Contents/Frameworks/Sparkle.framework" ]; then
            echo "Sparkle is inside the App Store build"; exit 1
          fi
          strings "$APP/Contents/MacOS/Needt" > "$RUNNER_TEMP/lite-strings.txt"
          if grep -q "SPUStandardUpdaterController" "$RUNNER_TEMP/lite-strings.txt"; then
            echo "Sparkle symbols are inside the App Store build"; exit 1
          fi
          otool -L "$APP/Contents/MacOS/Needt" | tee "$RUNNER_TEMP/lite-libs.txt"
          if grep -q "PrivateFrameworks" "$RUNNER_TEMP/lite-libs.txt"; then
            echo "The App Store binary links a private framework"; exit 1
          fi
          if grep -E "PrivateFrameworks|SkyLight|MediaRemote|IOReport|DisplayServices|CoreBrightness" "$RUNNER_TEMP/lite-strings.txt" | head -20 | grep .; then
            echo "A private interface is named in the App Store binary"; exit 1
          fi
          if grep -E "Upgrade now|Buy us a coffee|Unlock advanced features" "$RUNNER_TEMP/lite-strings.txt"; then
            echo "Purchase wording is inside the App Store build"; exit 1
          fi

      # The point of this build: no file from apps/macos/Island was compiled,
      # and none of its resources, packages or type names is in the bundle.
      - name: No file or symbol from Island/ is inside
        working-directory: apps/macos
        run: |
          set -euo pipefail
          APP=build-appstore-lite/NeedtAppStoreLite.xcarchive/Products/Applications/Needt.app
          python3 scripts/check-lite-no-island.py --derived build-appstore-lite/derived --app "$APP" \
            | tee out/lite-no-island.txt

      - name: Required Reason APIs in the Swift packages
        if: ${{ !cancelled() }}
        working-directory: apps/macos
        run: python3 scripts/check-appstore-privacy.py --variant lite --packages SourcePackages/checkouts | sed -n '/Swift packages/,$p'

      - name: Zip the archive
        if: ${{ !cancelled() }}
        working-directory: apps/macos
        run: |
          set -euo pipefail
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent build-appstore-lite/NeedtAppStoreLite.xcarchive out/NeedtAppStoreLite.xcarchive.zip
          ls -lh out/NeedtAppStoreLite.xcarchive.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: needt-macos-appstore-lite-archive
          path: apps/macos/out/NeedtAppStoreLite.xcarchive.zip
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: needt-macos-appstore-lite-log
          path: |
            apps/macos/build-appstore-lite.log
            apps/macos/out/lite-no-island.txt
          if-no-files-found: warn
