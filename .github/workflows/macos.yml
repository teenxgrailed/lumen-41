name: macOS

# Unsigned build of the native Mac app (apps/macos, SwiftUI/AppKit around a
# WKWebView) and a test run of the shared Swift package (apps/shared/NeedtKit).
# Not part of the release pipeline: nothing here signs, notarizes or publishes.
# The Windows app is still the Tauri one (desktop.yml).
on:
  push:
    paths:
      - "apps/macos/**"
      - "apps/shared/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

concurrency:
  group: needt-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Needt.app (unsigned)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Xcode version
        run: xcodebuild -version

      - name: NeedtKit tests
        working-directory: apps/shared/NeedtKit
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/macos
        run: xcodegen generate

      - name: Build (no signing)
        working-directory: apps/macos
        run: |
          set -o pipefail
          xcodebuild \
            -project Needt.xcodeproj \
            -scheme Needt \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 80

      - name: Compiler errors
        if: failure()
        working-directory: apps/macos
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Zip Needt.app
        working-directory: apps/macos
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/Needt.app
          test -d "$APP"
          plutil -p "$APP/Contents/Info.plist" | head -40
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/Needt-macos-unsigned.zip

      - name: App Store build has no Sparkle, direct build embeds the Share extension
        working-directory: apps/macos
        run: |
          set -euo pipefail
          xcodebuild \
            -project Needt.xcodeproj \
            -scheme NeedtAppStore \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build-appstore \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          STORE=build-appstore/Build/Products/Release/Needt.app
          DIRECT=build/Build/Products/Release/Needt.app
          test -d "$STORE"
          test -d "$STORE/Contents/PlugIns/NeedtShare.appex"
          test -d "$DIRECT/Contents/PlugIns/NeedtShare.appex"
          if [ -e "$STORE/Contents/Frameworks/Sparkle.framework" ]; then
            echo "Sparkle is inside the App Store build"; exit 1
          fi
          strings "$STORE/Contents/MacOS/Needt" > "$RUNNER_TEMP/store-strings.txt"
          if grep -q "SPUStandardUpdaterController" "$RUNNER_TEMP/store-strings.txt"; then
            echo "Sparkle symbols are inside the App Store build"; exit 1
          fi
          test -d "$DIRECT/Contents/Frameworks/Sparkle.framework"

      - name: Entitlements and private APIs
        working-directory: apps/macos
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib, sys
          def load(name):
              with open(f"Generated/{name}.entitlements", "rb") as f:
                  return plistlib.load(f)
          failed = False
          for name in ("Needt", "NeedtAppStore", "NeedtShare"):
              e = load(name)
              print(name, sorted(e))
              # The direct build is unsandboxed on purpose (the full island);
              # the App Store build and the extension must be sandboxed.
              need = ["com.apple.security.network.client",
                      "com.apple.security.application-groups"]
              if name != "Needt":
                  need.append("com.apple.security.app-sandbox")
              if name != "NeedtShare":
                  need.append("com.apple.security.files.user-selected.read-only")
              for key in need:
                  if not e.get(key):
                      print("missing", name, key); failed = True
              if not any("app.needt.mac" in g for g in e.get("com.apple.security.application-groups", [])):
                  print("no app group in", name); failed = True
          if "com.apple.security.temporary-exception.mach-lookup.global-name" in load("NeedtAppStore"):
              print("App Store entitlements carry a temporary exception"); failed = True
          sys.exit(1 if failed else 0)
          PY
          # No private API: no KVC into WebKit/AppKit internals, no private selectors by string.
          if grep -rnE 'drawsBackground|setValue\(.*forKey:|_setDrawsBackground|NSSelectorFromString|dlsym|objc_getClass' Needt Share; then
            echo "private API pattern found"; exit 1
          fi

      # Best effort: start the app for a few seconds and report whether it
      # stayed up. A runner has no signed-in person, so this shows the start
      # window; it proves the app launches, not that sign-in works.
      - name: Launch smoke test
        continue-on-error: true
        working-directory: apps/macos
        run: |
          set -u
          APP=build/Build/Products/Release/Needt.app
          mkdir -p out
          "$APP/Contents/MacOS/Needt" > out/launch.log 2>&1 &
          PID=$!
          sleep 12
          screencapture -x out/needt-start-window.png || true
          if kill -0 "$PID" 2>/dev/null; then
            echo "Needt is running after 12 s (pid $PID)"
            kill "$PID" || true
          else
            echo "Needt exited early"
            cat out/launch.log
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: needt-macos-unsigned
          path: |
            apps/macos/out/Needt-macos-unsigned.zip
            apps/macos/out/needt-start-window.png
            apps/macos/out/launch.log
            apps/macos/build.log
          if-no-files-found: warn
