# XcodeGen spec for the native Mac app. `xcodegen generate` writes
# Needt.xcodeproj (not committed); see README.md.
name: Needt

options:
  bundleIdPrefix: app.needt
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.6"
    ENABLE_HARDENED_RUNTIME: YES
    # The Sparkle EdDSA *public* key. Left empty here on purpose: the release
    # workflow passes it on the xcodebuild command line from the repository
    # variable SPARKLE_ED_PUBLIC_KEY (see README.md). While it is empty the app
    # never checks for updates.
    SPARKLE_PUBLIC_ED_KEY: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
  NeedtKit:
    path: ../shared/NeedtKit
  NeedtWidgetKit:
    path: ../shared/NeedtWidgetKit
  # The island's packages, pinned to the versions its own build resolved.
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    exactVersion: 9.0.3
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.3.0
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    revision: a04ec1c363be3627734f6dad757d82f5d4fa8fcc
  LottieUI:
    url: https://github.com/jasudev/LottieUI.git
    revision: 0cd5b54a1c8467b19c01f56395aec179087b62e2
  SwiftUIIntrospect:
    url: https://github.com/siteline/swiftui-introspect
    exactVersion: 1.3.0
  Collections:
    url: https://github.com/apple/swift-collections.git
    exactVersion: 1.1.4
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.13.0

# One shared scheme per App Store build, each with an Archive action in Release:
# `xcodebuild archive -scheme NeedtAppStore` (CI does this; see README.md,
# "Mac App Store"). NeedtAppStoreLite is the same app without the notch island.
# The other targets keep the schemes XcodeGen makes itself.
schemes:
  NeedtAppStore:
    build:
      targets:
        NeedtAppStore: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
  NeedtAppStoreLite:
    build:
      targets:
        NeedtAppStoreLite: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true

targets:
  # The direct-download build (Developer ID, Sparkle updates).
  Needt:
    type: application
    platform: macOS
    sources:
      - path: Needt/Sources
      - path: Needt/Resources
      - path: Island/Sources
        excludes:
          - Info.plist
          - DynamicIsland.entitlements
          - "tr.lproj/**"
          - Localizable.xcstrings
          # The island's own settings window is replaced by Needt's Settings.
          - components/Settings/IslandSettingsView.swift
          - components/Settings/AnimationEditorView.swift
          - components/Settings/ExtensionsSettings.swift
          - components/Settings/IdleAnimationsSettingsSection.swift
          - components/Settings/MusicSlotConfigurationView.swift
          - components/Settings/SpotifyAuthSettingsSection.swift
          - components/Settings/SpotifyLoginSheet.swift
          - components/Settings/ListItemPopover.swift
      - path: Island/LottieAnimations
      - path: Island/LICENSE.txt
      - path: Island/ACKNOWLEDGEMENTS.md
      # The CI harness: empty unless the build sets NEEDT_CI_CONDITION=NEEDT_CI
      # (.github/workflows/macos-webview.yml only; never a release build).
      - path: CI
    dependencies:
      - package: Sparkle
      - package: NeedtKit
      - package: Defaults
      - package: KeyboardShortcuts
      - package: LaunchAtLogin
      - package: LottieUI
      - package: SwiftUIIntrospect
      - package: Collections
      - package: SwiftTerm
      - target: NeedtShare
        embed: true
      - target: NeedtWidgets
        embed: true
    entitlements:
      path: Generated/Needt.entitlements
      properties:
        # The direct build is not sandboxed: the full island (system HUD,
        # media keys, sensors, terminal) needs it. The App Store build is.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.automation.apple-events: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
    info:
      path: Generated/Needt-Info.plist
      properties:
        CFBundleName: Needt
        CFBundleDisplayName: Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.6"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Needt"
        NSPrincipalClass: NSApplication
        # Resolves to "<TeamID>.app.needt.mac" when signed; NeedtKit falls back
        # to a private folder while the team prefix is empty (unsigned builds).
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        CFBundleURLTypes:
          - CFBundleURLName: app.needt.mac
            CFBundleURLSchemes: [needt]
        MetalCaptureEnabled: true
        # Debug builds may point at a local web app (NEEDT_URL).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Needt uses the microphone when you dictate.
        NSCameraUsageDescription: Needt uses the camera when you attach a photo and for the island mirror.
        NSAppleEventsUsageDescription: Needt uses AppleScript to show and control what Spotify and Apple Music are playing.
        NSBluetoothAlwaysUsageDescription: Needt shows when audio devices connect and their battery level in the island.
        NSCalendarsUsageDescription: Needt shows your next event in the island.
        NSCalendarsFullAccessUsageDescription: Needt shows your next event in the island.
        NSRemindersUsageDescription: Needt shows your reminders in the island.
        NSRemindersFullAccessUsageDescription: Needt shows your reminders in the island.
        NSLocationUsageDescription: Needt uses your location for the weather on the lock screen widget.
        NSLocationWhenInUseUsageDescription: Needt uses your location for the weather on the lock screen widget.
        NSDesktopFolderUsageDescription: Needt saves screenshots to your Desktop.
        NSDocumentsFolderUsageDescription: Needt saves and reads files you drop on the island shelf.
        NSDownloadsFolderUsageDescription: Needt reads your Downloads folder to show download progress in the island.
        NSAudioCaptureUsageDescription: Needt listens to system audio to draw the live music visualizer.
        NSScreenCaptureUsageDescription: Needt captures the screen when you ask the island assistant about it.
        NSAppleMusicUsageDescription: Needt looks up the moving cover art for the song playing in the island. It asks only after you turn on Animated cover art in Settings, Island, Music.
        # The fixed release "mac-appcast" holds the one appcast.xml, replaced by
        # .github/workflows/macos-release.yml on every release.
        SUFeedURL: https://github.com/teenxgrailed/lumen-41/releases/download/mac-appcast/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac
        PRODUCT_NAME: Needt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Island/Sources/DynamicIsland-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        MTL_FAST_MATH: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Empty: CI passes NEEDT_CI_CONDITION=NEEDT_CI to compile apps/macos/CI.
        NEEDT_CI_CONDITION: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(NEEDT_CI_CONDITION)"

  # The Mac App Store build: same sources, no Sparkle (the APPSTORE flag and
  # the missing package keep every updater out), no mach-lookup exception.
  NeedtAppStore:
    type: application
    platform: macOS
    sources:
      - path: Needt/Sources
      - path: Needt/Resources
      - path: Island/Sources
        excludes:
          - Info.plist
          - DynamicIsland.entitlements
          - "tr.lproj/**"
          - Localizable.xcstrings
          # The island's own settings window is replaced by Needt's Settings.
          - components/Settings/IslandSettingsView.swift
          - components/Settings/AnimationEditorView.swift
          - components/Settings/ExtensionsSettings.swift
          - components/Settings/IdleAnimationsSettingsSection.swift
          - components/Settings/MusicSlotConfigurationView.swift
          - components/Settings/SpotifyAuthSettingsSection.swift
          - components/Settings/SpotifyLoginSheet.swift
          - components/Settings/ListItemPopover.swift
          # --- Mac App Store: no private or restricted interfaces ----------
          # SkyLight window-server spaces
          - private/**
          # volume / brightness / keyboard HUD (DisplayServices, CoreBrightness,
          # media-key event taps, OSD helper)
          - components/OSD/**
          - helpers/CoreBrightnessDisplayClient.swift
          - helpers/DisplayServicesDynamic.swift
          - helpers/SystemHUDDebugger.swift
          - managers/SystemMediaControllers.swift
          - managers/SystemOSDManager.swift
          - managers/SystemHUDManager.swift
          - managers/SystemVolumeManager.swift
          - managers/SystemKeyObserver.swift
          - managers/SystemKeyboardBacklightController.swift
          - managers/SystemDisplayManager.swift
          - managers/SystemChangesObserver.swift
          - managers/KeyboardBrightnessSensor.swift
          - managers/MediaKeyInterceptor.swift
          - managers/CustomOSDWindowManager.swift
          - managers/CircularHUDWindowManager.swift
          - managers/VerticalHUDWindowManager.swift
          - managers/BetterDisplayManager.swift
          - managers/LunarManager.swift
          # CPU / GPU / memory sensors (IOReport, SMC)
          - components/Stats/**
          - components/Notch/NotchStatsView.swift
          - managers/StatsManager.swift
          - utils/IOReportBridging.swift
          - utils/CPUSensorCollector.swift
          - utils/SMC.swift
          # Accessibility-driven features and permission helpers
          - managers/SystemTimerBridge.swift
          - observers/FullscreenMediaDetection.swift
          - helpers/AccessibilityPermissionStore.swift
          - helpers/FullDiskAccessPermissionStore.swift
          # Focus and Bluetooth internals, screen-recording detection
          - managers/DoNotDisturbManager.swift
          - components/Focus/DoNotDisturbLiveActivity.swift
          - managers/BluetoothAudioManager.swift
          - managers/ScreenRecordingManager.swift
          # automation of apps other than Music and Spotify, shells, other apps' data
          - managers/AppleNotesSyncManager.swift
          - managers/TerminalManager.swift
          - components/Notch/NotchTerminalView.swift
          - components/DynamicIslandSystemTiles.swift
          - managers/LLMUsage/**
          - components/Notch/NotchLLMUsageView.swift
          # private SwiftUI symbol, private glass material
          - extensions/Image+InternalSystemName.swift
          - helpers/LiquidGlassBackground.swift
          # upstream "Upgrade now" tips and a "Buy us a coffee" button: nothing
          # in Needt shows them, and App Review 3.1.1 must not find the words
          - components/Tips/TipStore.swift
          - components/Onboarding/ProOnboarding.swift
          # --- Mac App Store: the island is the Needt modules, the calendar and
          # music through AppleScript. Nothing that runs a subprocess, edits
          # system state, listens on a socket or sends data to a third party.
          # Spotify web player token (third-party secrets) and canvas endpoints
          - managers/SpotifyAuthManager.swift
          # Screen Assistant: screencapture subprocess and four LLM APIs
          - components/ScreenAssistant/**
          - managers/ScreenAssistantManager.swift
          - managers/ScreenAssistantPanelManager.swift
          # lock screen artwork wallpaper: edits the wallpaper Index.plist, killall
          - managers/FullScreenArtworkWindowManager.swift
          # LocalSend: multicast discovery, arp subprocess, a local server
          - components/Shelf/Services/LocalSendService.swift
          - components/Shelf/Views/LocalSendLiveActivity.swift
          - managers/LocalSendDevicePickerWindowManager.swift
          # Chromium download watcher: watches ~/Downloads, outside the sandbox
          - managers/DownloadManager.swift
          - components/Downloads/**
          # third-party extension API: websocket server (NWListener) and XPC listener
          - services/Extensions/ExtensionRPCServer.swift
          - services/Extensions/ExtensionRPCService.swift
          - services/Extensions/ExtensionRPCMessages.swift
          - services/Extensions/ExtensionXPCService.swift
          - services/Extensions/ExtensionXPCServiceHost.swift
      - path: Island/AppStore
      # Privacy manifest (App Store requirement); see Privacy/AppStore.
      - path: Privacy/AppStore/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Island/LottieAnimations
      - path: Island/LICENSE.txt
      - path: Island/ACKNOWLEDGEMENTS.md
    dependencies:
      - package: NeedtKit
      - package: Defaults
      - package: KeyboardShortcuts
      - package: LaunchAtLogin
      - package: LottieUI
      - package: SwiftUIIntrospect
      - package: Collections
      - target: NeedtShare
        embed: true
      - target: NeedtWidgets
        embed: true
    entitlements:
      path: Generated/NeedtAppStore.entitlements
      # Each entitlement is here for code compiled into this target;
      # scripts/check-appstore-bundle.py fails when one has no usage string.
      properties:
        # Mac App Store requirement.
        com.apple.security.app-sandbox: true
        # The web app and the Needt API (use.needt.app), plus Apple's own
        # services for the now-playing card (iTunes Search for cover art, MusicKit
        # for animated covers). No weather, lyrics, Spotify web or downloads in
        # this build.
        com.apple.security.network.client: true
        # The web app's file inputs (NeedtWebView.runOpenPanel) and the island
        # Shelf (drop, open panel). Read only: nothing writes to those files
        # (the Shelf's Rename and Compress items are not in this build).
        com.apple.security.files.user-selected.read-only: true
        # The Shelf keeps files as security-scoped bookmarks
        # (Island/Sources/components/Shelf/Models/Bookmark.swift); the sandbox
        # refuses .withSecurityScope bookmarks without this.
        com.apple.security.files.bookmarks.app-scope: true
        # Island webcam mirror (WebcamManager) and the web app's camera inputs.
        com.apple.security.device.camera: true
        # The web app's dictation (getUserMedia).
        com.apple.security.device.audio-input: true
        # EventKit events and reminders for the island (CalendarManager).
        com.apple.security.personal-information.calendars: true
        # Music works for Apple Music and Spotify only, through Apple Events.
        # The group names must exist in each app's scripting definition
        # (sdef); CI prints them from the runner's Music.app and Spotify.app.
        # playback = play/pause/next and the player state; the library group
        # covers the track class (name, artist, album, duration, artwork of
        # the current track), which the now-playing card reads (checked in
        # each app's sdef on the runner, 2026-11-03: the track class sits in
        # com.apple.Music.library.read and com.spotify.library). Read-only:
        # nothing writes to either library.
        com.apple.security.scripting-targets:
          com.apple.Music:
            - com.apple.Music.playback
            - com.apple.Music.library.read
          com.spotify.client:
            - com.spotify.playback
            - com.spotify.library
        # Share and widget extensions read the same session and cache.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
    info:
      path: Generated/NeedtAppStore-Info.plist
      properties:
        CFBundleName: Needt
        CFBundleDisplayName: Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.6"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Needt"
        NSPrincipalClass: NSApplication
        # Only HTTPS through the system and hashing (CryptoKit SHA-256 for the
        # sign-in challenge): exempt. No Bluetooth, Desktop, Documents,
        # Downloads or screen strings: the sandbox build has neither the
        # entitlement nor the code for them. No NSAppTransportSecurity.
        ITSAppUsesNonExemptEncryption: false
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        CFBundleURLTypes:
          - CFBundleURLName: app.needt.mac
            CFBundleURLSchemes: [needt]
        NSMicrophoneUsageDescription: Needt uses the microphone when you dictate.
        NSCameraUsageDescription: Needt uses the camera when you attach a photo and for the island mirror.
        NSAppleEventsUsageDescription: Needt uses AppleScript to show and control what Spotify and Apple Music are playing.
        NSCalendarsUsageDescription: Needt shows your next event in the island.
        NSCalendarsFullAccessUsageDescription: Needt shows your next event in the island.
        NSRemindersUsageDescription: Needt shows your reminders in the island.
        NSRemindersFullAccessUsageDescription: Needt shows your reminders in the island.
        NSAudioCaptureUsageDescription: Needt listens to system audio to draw the live music visualizer.
        NSAppleMusicUsageDescription: Needt looks up the moving cover art for the song playing in the island. It asks only after you turn on Animated cover art in Settings, Island, Music.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac
        PRODUCT_NAME: Needt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Island/Sources/DynamicIsland-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        MTL_FAST_MATH: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"

  # The Mac App Store build without the notch island. The same bundle id as
  # NeedtAppStore (only one of the two is ever uploaded: store-upload.yml,
  # input mac_variant). It compiles nothing from Island/ (a fork of Atoll /
  # boring.notch, GPL v3), links none of the island's packages, and carries no
  # entitlement or usage string that only the island needed. Needt/Sources code
  # that talks to the island is behind `#if !NO_ISLAND`. Nothing here is built
  # unless this target's scheme is: the default store build is NeedtAppStore.
  NeedtAppStoreLite:
    type: application
    platform: macOS
    sources:
      - path: Needt/Sources
      - path: Needt/Resources
      # Privacy manifest (App Store requirement): the same file as
      # NeedtAppStore. The Required Reason use is the same (UserDefaults, CA92.1,
      # from FocusBridge and the Settings pane) and so is the data the service
      # keeps; scripts/check-appstore-privacy.py --variant lite checks it
      # against the sources this target compiles.
      - path: Privacy/AppStore/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: NeedtKit
      - target: NeedtShare
        embed: true
      - target: NeedtWidgets
        embed: true
    entitlements:
      path: Generated/NeedtAppStoreLite.entitlements
      # Each entitlement is here for code compiled into this target;
      # scripts/check-appstore-bundle.py --variant lite fails when one has no
      # usage string or is not on its (shorter) allow list.
      properties:
        # Mac App Store requirement.
        com.apple.security.app-sandbox: true
        # The web app and the Needt API (use.needt.app).
        com.apple.security.network.client: true
        # The web app's file inputs (NeedtWebView.runOpenPanel). Read only.
        com.apple.security.files.user-selected.read-only: true
        # The web app's dictation (Web Speech API in the web view).
        com.apple.security.device.audio-input: true
        # Share and widget extensions read the same session and cache.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
        # Left out against NeedtAppStore, because only the island used them:
        # files.bookmarks.app-scope (island Shelf bookmarks), device.camera
        # (island webcam mirror; the web app has no camera call),
        # personal-information.calendars (EventKit is used only in Island/),
        # scripting-targets for Music and Spotify (island now-playing).
    info:
      path: Generated/NeedtAppStoreLite-Info.plist
      properties:
        CFBundleName: Needt
        CFBundleDisplayName: Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.6"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Needt"
        NSPrincipalClass: NSApplication
        ITSAppUsesNonExemptEncryption: false
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        CFBundleURLTypes:
          - CFBundleURLName: app.needt.mac
            CFBundleURLSchemes: [needt]
        NSMicrophoneUsageDescription: Needt uses the microphone when you dictate.
        # No camera, Apple Events, calendar, reminders, audio capture or Apple
        # Music strings: those belonged to the island.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac
        PRODUCT_NAME: Needt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE NO_ISLAND"

  # "Add to Needt" in the Share menu: a URL or text becomes a task.
  NeedtShare:
    type: app-extension
    platform: macOS
    sources:
      - path: Share/Sources
      - path: Privacy/Share/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: NeedtKit
    entitlements:
      path: Generated/NeedtShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
    info:
      path: Generated/NeedtShare-Info.plist
      properties:
        CFBundleName: Add to Needt
        CFBundleDisplayName: Add to Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.6"
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac.share
        PRODUCT_NAME: NeedtShare
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # Widgets for the desktop and Notification Center (WidgetKit): Today
  # (small / medium / large / extra large), Next event, Focus timer, Habits,
  # Quick add. The views, data and intents are in
  # apps/shared/NeedtWidgetKit and NeedtKit.
  NeedtWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets/Sources
      - path: Privacy/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: NeedtKit
      - package: NeedtWidgetKit
    entitlements:
      path: Generated/NeedtWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
    info:
      path: Generated/NeedtWidgets-Info.plist
      properties:
        CFBundleName: Needt Widgets
        CFBundleDisplayName: Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac.widgets
        PRODUCT_NAME: NeedtWidgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
