# XcodeGen spec for the native Mac app. `xcodegen generate` writes
# Needt.xcodeproj (not committed); see README.md.
name: Needt

options:
  bundleIdPrefix: app.needt
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.6"
    ENABLE_HARDENED_RUNTIME: YES
    # The Sparkle EdDSA *public* key. Left empty here on purpose: the release
    # workflow passes it on the xcodebuild command line from the repository
    # variable SPARKLE_ED_PUBLIC_KEY (see README.md). While it is empty the app
    # never checks for updates.
    SPARKLE_PUBLIC_ED_KEY: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
  NeedtKit:
    path: ../shared/NeedtKit
  NeedtWidgetKit:
    path: ../shared/NeedtWidgetKit
  # The island's packages, pinned to the versions its own build resolved.
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    exactVersion: 9.0.3
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.3.0
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    revision: a04ec1c363be3627734f6dad757d82f5d4fa8fcc
  LottieUI:
    url: https://github.com/jasudev/LottieUI.git
    revision: 0cd5b54a1c8467b19c01f56395aec179087b62e2
  SwiftUIIntrospect:
    url: https://github.com/siteline/swiftui-introspect
    exactVersion: 1.3.0
  Collections:
    url: https://github.com/apple/swift-collections.git
    exactVersion: 1.1.4
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.13.0

targets:
  # The direct-download build (Developer ID, Sparkle updates).
  Needt:
    type: application
    platform: macOS
    sources:
      - path: Needt/Sources
      - path: Needt/Resources
      - path: Island/Sources
        excludes:
          - Info.plist
          - DynamicIsland.entitlements
          - "tr.lproj/**"
          - Localizable.xcstrings
          # The island's own settings window is replaced by Needt's Settings.
          - components/Settings/IslandSettingsView.swift
          - components/Settings/AnimationEditorView.swift
          - components/Settings/ExtensionsSettings.swift
          - components/Settings/IdleAnimationsSettingsSection.swift
          - components/Settings/MusicSlotConfigurationView.swift
          - components/Settings/SpotifyAuthSettingsSection.swift
          - components/Settings/SpotifyLoginSheet.swift
          - components/Settings/ListItemPopover.swift
      - path: Island/LottieAnimations
      - path: Island/LICENSE.txt
      - path: Island/ACKNOWLEDGEMENTS.md
      # The CI harness: empty unless the build sets NEEDT_CI_CONDITION=NEEDT_CI
      # (.github/workflows/macos-webview.yml only; never a release build).
      - path: CI
    dependencies:
      - package: Sparkle
      - package: NeedtKit
      - package: Defaults
      - package: KeyboardShortcuts
      - package: LaunchAtLogin
      - package: LottieUI
      - package: SwiftUIIntrospect
      - package: Collections
      - package: SwiftTerm
      - target: NeedtShare
        embed: true
      - target: NeedtWidgets
        embed: true
    entitlements:
      path: Generated/Needt.entitlements
      properties:
        # The direct build is not sandboxed: the full island (system HUD,
        # media keys, sensors, terminal) needs it. The App Store build is.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.automation.apple-events: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
    info:
      path: Generated/Needt-Info.plist
      properties:
        CFBundleName: Needt
        CFBundleDisplayName: Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.6"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Needt"
        NSPrincipalClass: NSApplication
        # Resolves to "<TeamID>.app.needt.mac" when signed; NeedtKit falls back
        # to a private folder while the team prefix is empty (unsigned builds).
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        CFBundleURLTypes:
          - CFBundleURLName: app.needt.mac
            CFBundleURLSchemes: [needt]
        MetalCaptureEnabled: true
        # Debug builds may point at a local web app (NEEDT_URL).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Needt uses the microphone when you dictate.
        NSCameraUsageDescription: Needt uses the camera when you attach a photo and for the island mirror.
        NSAppleEventsUsageDescription: Needt uses AppleScript to show and control what Spotify and Apple Music are playing.
        NSBluetoothAlwaysUsageDescription: Needt shows when audio devices connect and their battery level in the island.
        NSCalendarsUsageDescription: Needt shows your next event in the island.
        NSCalendarsFullAccessUsageDescription: Needt shows your next event in the island.
        NSRemindersUsageDescription: Needt shows your reminders in the island.
        NSRemindersFullAccessUsageDescription: Needt shows your reminders in the island.
        NSLocationUsageDescription: Needt uses your location for the weather on the lock screen widget.
        NSLocationWhenInUseUsageDescription: Needt uses your location for the weather on the lock screen widget.
        NSDesktopFolderUsageDescription: Needt saves screenshots to your Desktop.
        NSDocumentsFolderUsageDescription: Needt saves and reads files you drop on the island shelf.
        NSDownloadsFolderUsageDescription: Needt reads your Downloads folder to show download progress in the island.
        NSAudioCaptureUsageDescription: Needt listens to system audio to draw the live music visualizer.
        NSScreenCaptureUsageDescription: Needt captures the screen when you ask the island assistant about it.
        NSAppleMusicUsageDescription: Needt looks up the moving cover art for the song playing in the island. It asks only after you turn on Animated cover art in Settings, Island, Music.
        # The fixed release "mac-appcast" holds the one appcast.xml, replaced by
        # .github/workflows/macos-release.yml on every release.
        SUFeedURL: https://github.com/teenxgrails/needt/releases/download/mac-appcast/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac
        PRODUCT_NAME: Needt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Island/Sources/DynamicIsland-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        MTL_FAST_MATH: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Empty: CI passes NEEDT_CI_CONDITION=NEEDT_CI to compile apps/macos/CI.
        NEEDT_CI_CONDITION: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(NEEDT_CI_CONDITION)"

  # The Mac App Store build: same sources, no Sparkle (the APPSTORE flag and
  # the missing package keep every updater out), no mach-lookup exception.
  NeedtAppStore:
    type: application
    platform: macOS
    sources:
      - path: Needt/Sources
      - path: Needt/Resources
      - path: Island/Sources
        excludes:
          - Info.plist
          - DynamicIsland.entitlements
          - "tr.lproj/**"
          - Localizable.xcstrings
          # The island's own settings window is replaced by Needt's Settings.
          - components/Settings/IslandSettingsView.swift
          - components/Settings/AnimationEditorView.swift
          - components/Settings/ExtensionsSettings.swift
          - components/Settings/IdleAnimationsSettingsSection.swift
          - components/Settings/MusicSlotConfigurationView.swift
          - components/Settings/SpotifyAuthSettingsSection.swift
          - components/Settings/SpotifyLoginSheet.swift
          - components/Settings/ListItemPopover.swift
          # --- Mac App Store: no private or restricted interfaces ----------
          # SkyLight window-server spaces
          - private/**
          # volume / brightness / keyboard HUD (DisplayServices, CoreBrightness,
          # media-key event taps, OSD helper)
          - components/OSD/**
          - helpers/CoreBrightnessDisplayClient.swift
          - helpers/DisplayServicesDynamic.swift
          - helpers/SystemHUDDebugger.swift
          - managers/SystemMediaControllers.swift
          - managers/SystemOSDManager.swift
          - managers/SystemHUDManager.swift
          - managers/SystemVolumeManager.swift
          - managers/SystemKeyObserver.swift
          - managers/SystemKeyboardBacklightController.swift
          - managers/SystemDisplayManager.swift
          - managers/SystemChangesObserver.swift
          - managers/KeyboardBrightnessSensor.swift
          - managers/MediaKeyInterceptor.swift
          - managers/CustomOSDWindowManager.swift
          - managers/CircularHUDWindowManager.swift
          - managers/VerticalHUDWindowManager.swift
          - managers/BetterDisplayManager.swift
          - managers/LunarManager.swift
          # CPU / GPU / memory sensors (IOReport, SMC)
          - components/Stats/**
          - components/Notch/NotchStatsView.swift
          - managers/StatsManager.swift
          - utils/IOReportBridging.swift
          - utils/CPUSensorCollector.swift
          - utils/SMC.swift
          # Accessibility-driven features and permission helpers
          - managers/SystemTimerBridge.swift
          - observers/FullscreenMediaDetection.swift
          - helpers/AccessibilityPermissionStore.swift
          - helpers/FullDiskAccessPermissionStore.swift
          # Focus and Bluetooth internals, screen-recording detection
          - managers/DoNotDisturbManager.swift
          - components/Focus/DoNotDisturbLiveActivity.swift
          - managers/BluetoothAudioManager.swift
          - managers/ScreenRecordingManager.swift
          # automation of apps other than Music and Spotify, shells, other apps' data
          - managers/AppleNotesSyncManager.swift
          - managers/TerminalManager.swift
          - components/Notch/NotchTerminalView.swift
          - components/DynamicIslandSystemTiles.swift
          - managers/LLMUsage/**
          - components/Notch/NotchLLMUsageView.swift
          # private SwiftUI symbol, private glass material
          - extensions/Image+InternalSystemName.swift
          - helpers/LiquidGlassBackground.swift
      - path: Island/AppStore
      - path: Island/LottieAnimations
      - path: Island/LICENSE.txt
      - path: Island/ACKNOWLEDGEMENTS.md
    dependencies:
      - package: NeedtKit
      - package: Defaults
      - package: KeyboardShortcuts
      - package: LaunchAtLogin
      - package: LottieUI
      - package: SwiftUIIntrospect
      - package: Collections
      - target: NeedtShare
        embed: true
      - target: NeedtWidgets
        embed: true
    entitlements:
      path: Generated/NeedtAppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        # Music works for Apple Music and Spotify only, through Apple Events.
        com.apple.security.scripting-targets:
          com.apple.Music:
            - com.apple.Music.playback
          com.spotify.client:
            - com.spotify.client.playback
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
    info:
      path: Generated/NeedtAppStore-Info.plist
      properties:
        CFBundleName: Needt
        CFBundleDisplayName: Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.6"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Needt"
        NSPrincipalClass: NSApplication
        ITSAppUsesNonExemptEncryption: false
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        CFBundleURLTypes:
          - CFBundleURLName: app.needt.mac
            CFBundleURLSchemes: [needt]
        NSMicrophoneUsageDescription: Needt uses the microphone when you dictate.
        NSCameraUsageDescription: Needt uses the camera when you attach a photo and for the island mirror.
        NSAppleEventsUsageDescription: Needt uses AppleScript to show and control what Spotify and Apple Music are playing.
        NSBluetoothAlwaysUsageDescription: Needt shows when audio devices connect and their battery level in the island.
        NSCalendarsUsageDescription: Needt shows your next event in the island.
        NSCalendarsFullAccessUsageDescription: Needt shows your next event in the island.
        NSRemindersUsageDescription: Needt shows your reminders in the island.
        NSRemindersFullAccessUsageDescription: Needt shows your reminders in the island.
        NSLocationUsageDescription: Needt uses your location for the weather on the lock screen widget.
        NSLocationWhenInUseUsageDescription: Needt uses your location for the weather on the lock screen widget.
        NSDesktopFolderUsageDescription: Needt saves screenshots to your Desktop.
        NSDocumentsFolderUsageDescription: Needt saves and reads files you drop on the island shelf.
        NSDownloadsFolderUsageDescription: Needt reads your Downloads folder to show download progress in the island.
        NSAudioCaptureUsageDescription: Needt listens to system audio to draw the live music visualizer.
        NSScreenCaptureUsageDescription: Needt captures the screen when you ask the island assistant about it.
        NSAppleMusicUsageDescription: Needt looks up the moving cover art for the song playing in the island. It asks only after you turn on Animated cover art in Settings, Island, Music.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac
        PRODUCT_NAME: Needt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Island/Sources/DynamicIsland-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        MTL_FAST_MATH: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"

  # "Add to Needt" in the Share menu: a URL or text becomes a task.
  NeedtShare:
    type: app-extension
    platform: macOS
    sources:
      - path: Share/Sources
    dependencies:
      - package: NeedtKit
    entitlements:
      path: Generated/NeedtShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
    info:
      path: Generated/NeedtShare-Info.plist
      properties:
        CFBundleName: Add to Needt
        CFBundleDisplayName: Add to Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.6"
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac.share
        PRODUCT_NAME: NeedtShare
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # Widgets for the desktop and Notification Center (WidgetKit): Today
  # (small / medium / large / extra large), Next event, Focus timer, Habits,
  # Quick add. The views, data and intents are in
  # apps/shared/NeedtWidgetKit and NeedtKit.
  NeedtWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets/Sources
    dependencies:
      - package: NeedtKit
      - package: NeedtWidgetKit
    entitlements:
      path: Generated/NeedtWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
    info:
      path: Generated/NeedtWidgets-Info.plist
      properties:
        CFBundleName: Needt Widgets
        CFBundleDisplayName: Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac.widgets
        PRODUCT_NAME: NeedtWidgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
