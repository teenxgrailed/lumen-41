# XcodeGen spec for the native Mac app. `xcodegen generate` writes
# Needt.xcodeproj (not committed); see README.md.
name: Needt

options:
  bundleIdPrefix: app.needt
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Set to the Sparkle EdDSA *public* key (see README.md). While it is empty
    # the app never checks for updates.
    SPARKLE_PUBLIC_ED_KEY: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
  NeedtKit:
    path: ../shared/NeedtKit

targets:
  # The direct-download build (Developer ID, Sparkle updates).
  Needt:
    type: application
    platform: macOS
    sources:
      - path: Needt/Sources
      - path: Needt/Resources
    dependencies:
      - package: Sparkle
      - package: NeedtKit
      - target: NeedtShare
        embed: true
    entitlements:
      path: Generated/Needt.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
        # Sparkle's installer launcher and status services (sandboxed updates).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    info:
      path: Generated/Needt-Info.plist
      properties:
        CFBundleName: Needt
        CFBundleDisplayName: Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Needt"
        NSPrincipalClass: NSApplication
        # Resolves to "<TeamID>.app.needt.mac" when signed; NeedtKit falls back
        # to a private folder while the team prefix is empty (unsigned builds).
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        CFBundleURLTypes:
          - CFBundleURLName: app.needt.mac
            CFBundleURLSchemes: [needt]
        # Debug builds may point at a local web app (NEEDT_URL).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Needt uses the microphone when you dictate.
        NSCameraUsageDescription: Needt uses the camera when you attach a photo.
        SUFeedURL: https://needt.app/desktop/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac
        PRODUCT_NAME: Needt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # The Mac App Store build: same sources, no Sparkle (the APPSTORE flag and
  # the missing package keep every updater out), no mach-lookup exception.
  NeedtAppStore:
    type: application
    platform: macOS
    sources:
      - path: Needt/Sources
      - path: Needt/Resources
    dependencies:
      - package: NeedtKit
      - target: NeedtShare
        embed: true
    entitlements:
      path: Generated/NeedtAppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
    info:
      path: Generated/NeedtAppStore-Info.plist
      properties:
        CFBundleName: Needt
        CFBundleDisplayName: Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Needt"
        NSPrincipalClass: NSApplication
        ITSAppUsesNonExemptEncryption: false
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        CFBundleURLTypes:
          - CFBundleURLName: app.needt.mac
            CFBundleURLSchemes: [needt]
        NSMicrophoneUsageDescription: Needt uses the microphone when you dictate.
        NSCameraUsageDescription: Needt uses the camera when you attach a photo.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac
        PRODUCT_NAME: Needt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"

  # "Add to Needt" in the Share menu: a URL or text becomes a task.
  NeedtShare:
    type: app-extension
    platform: macOS
    sources:
      - path: Share/Sources
    dependencies:
      - package: NeedtKit
    entitlements:
      path: Generated/NeedtShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)app.needt.mac
    info:
      path: Generated/NeedtShare-Info.plist
      properties:
        CFBundleName: Add to Needt
        CFBundleDisplayName: Add to Needt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NeedtAppGroup: $(TeamIdentifierPrefix)app.needt.mac
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.needt.mac.share
        PRODUCT_NAME: NeedtShare
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
