<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Needt for Chrome</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    body { max-width: 560px; margin: 32px auto; padding: 0 16px; display: grid; gap: 24px; }
    section { display: grid; gap: 8px; }
    h1 { font-size: 13px; line-height: 18px; font-weight: 600; margin: 0; }
    h2 { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-quaternary); margin: 0; }
    textarea { min-height: 56px; resize: vertical; }
  </style>
</head>
<body>
  <h1><span class="mark"></span>Needt for Chrome</h1>

  <section>
    <h2>Connection</h2>
    <div class="row"><label class="label" for="baseUrl">Server</label><input id="baseUrl" placeholder="https://use.needt.app" /></div>
    <div class="row"><label class="label" for="token">Token</label><input id="token" type="password" placeholder="needt_… (Settings → Personal API)" /></div>
    <div class="row"><span></span><div><button id="save" class="primary">Save and check</button></div></div>
    <div class="row"><span></span><div id="connection" class="status"></div></div>
  </section>

  <section>
    <h2>Focus blocking</h2>
    <p class="meta">Needt decides what to block: the profiles you keep with the agent or the API (needt_blocking_profile). This extension blocks the sites while a focus session, a matching calendar event or a project's task block runs.</p>
    <div class="row"><span class="label">Now</span><div id="blocking" class="status"></div></div>
  </section>

  <section>
    <h2>YouTube goal filter</h2>
    <div class="row"><label class="label" for="filterEnabled">During focus</label>
      <select id="filterEnabled"><option value="on">Dim videos off my goal, hide Shorts</option><option value="off">Leave YouTube alone</option></select></div>
    <div class="row"><label class="label" for="filterThreshold">Strictness</label>
      <select id="filterThreshold"><option value="0.2">Loose</option><option value="0.34">Normal</option><option value="0.5">Strict</option></select></div>
    <div class="row"><label class="label" for="filterDailySnooze">Snooze a day</label>
      <select id="filterDailySnooze"><option value="0">None</option><option value="15">15 min</option><option value="30">30 min</option></select></div>
    <div class="row"><label class="label" for="allowChannels">Always show</label><textarea id="allowChannels" placeholder="One channel per line"></textarea></div>
    <div class="row"><label class="label" for="blockChannels">Always dim</label><textarea id="blockChannels" placeholder="One channel per line"></textarea></div>
    <div class="row"><span></span><div><button id="saveFilter">Save filter</button> <span id="filterStatus" class="status"></span></div></div>
  </section>
  <script type="module" src="options.js"></script>
</body>
</html>
