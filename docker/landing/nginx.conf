server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Coolify/Traefik terminates TLS and sits in front; keep the real client IP.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  # --- compression ----------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # --- health ---------------------------------------------------------------
  # Plain 200, no filesystem work, so the healthcheck cannot be confused by a
  # redirect or by the page itself changing.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
  }

  # --- the page -------------------------------------------------------------
  # Never cached. It is the product, and a stale copy in someone's browser is a
  # stale price list.
  error_page 404 /404.html;

  location ~* \.html$ {
    include /etc/nginx/landing/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # --- static assets --------------------------------------------------------
  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?|avif|mp4)$ {
    include /etc/nginx/landing/security-headers.conf;
    expires 30d;
    add_header Cache-Control "public, immutable" always;
  }

  location / {
    include /etc/nginx/landing/security-headers.conf;
    try_files $uri $uri/ =404;
  }
}
