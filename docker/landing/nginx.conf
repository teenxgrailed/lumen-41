# --- A/B test of the home hero (03.11.26) ---------------------------------
# "/" is split 50/50 between index.html (A) and index-b.html (B) by a hash of
# the client IP and user agent: the same visitor keeps seeing the same variant,
# and no cookie is set. Crawlers always get A. ?v=a or ?v=b forces a variant.
# The pages report the variant to Umami (events home_view and signup_click).
# To end the test: delete these three blocks and the rewrite in /index.html.
split_clients "${remote_addr}${http_user_agent}" $home_split {
  50% a;
  *   b;
}
map $http_user_agent $home_bot {
  default 0;
  "~*(bot|crawl|spider|slurp|facebookexternalhit|embedly|preview|lighthouse)" 1;
}
map "$arg_v:$home_bot:$home_split" $home_variant {
  ~^b:   b;
  ~^a:   a;
  ~^:1:  a;
  default $home_split;
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # /best -> /best/ must keep the public host and scheme; Traefik terminates TLS,
  # so an absolute Location would point at http://<container-host>/.
  absolute_redirect off;

  # Coolify/Traefik terminates TLS and sits in front; keep the real client IP.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  # --- compression ----------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml image/x-icon;

  # --- health ---------------------------------------------------------------
  # Plain 200, no filesystem work, so the healthcheck cannot be confused by a
  # redirect or by the page itself changing.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
  }

  # --- the pages -------------------------------------------------------------
  # Never cached. They are the product, and a stale copy in someone's browser is
  # a stale price list. The exact-match block serves "/" (index directive); the
  # regex block catches every directory page (/best/, /compare/x/, ...) because
  # try_files / index resolve them to <dir>/index.html internally, and the
  # location is chosen again for that new URI. It also covers /404.html.
  error_page 404 /404.html;

  # --- legal pages live in the app ------------------------------------------
  # The only copies of the privacy notice and the terms are on use.needt.app;
  # the old landing copies are gone. Permanent redirect, any trailing form.
  location ~ ^/(privacy|terms)(?:/|/index\.html)?$ {
    return 301 https://use.needt.app/$1;
  }

  # The refund promise lives in the terms, section 5.5; the heading id is the
  # app's slug of "5.5 Refunds and the right of withdrawal".
  location ~ ^/refunds?(?:/|/index\.html)?$ {
    return 301 https://use.needt.app/terms#5-5-refunds-and-the-right-of-withdrawal;
  }

  location = /index.html {
    if ($home_variant = b) { rewrite ^ /index-b.html last; }
    include /etc/nginx/landing/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~* \.html$ {
    include /etc/nginx/landing/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # --- crawler and install files -------------------------------------------
  # Unhashed names that change in place, so they get an hour, not a month.
  # Each location carries its own add_header, so each includes the headers.
  location = /llms.txt {
    types { text/plain txt; }
    default_type text/plain;
    charset utf-8;
    include /etc/nginx/landing/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /robots.txt {
    include /etc/nginx/landing/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /sitemap.xml {
    types { application/xml xml; }
    default_type application/xml;
    include /etc/nginx/landing/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Older nginx mime.types lack .webmanifest; declare it here rather than rely on it.
  location = /site.webmanifest {
    types { application/manifest+json webmanifest; }
    include /etc/nginx/landing/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Icons keep their names when the artwork changes, so they must not be
  # immutable; a day is enough for Google and browsers to pick up a new one.
  location ~* ^/(?:favicon\.(?:ico|svg)|apple-touch-icon\.png|icon-(?:48|96|192|512)\.png|assets/(?:icon(?:-dark)?\.svg|icon-(?:48|96|192|512)\.png|favicon\.ico|apple-touch-icon\.png))$ {
    include /etc/nginx/landing/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }

  # --- Open Graph cards -------------------------------------------------------
  # One JPEG per page under /assets/og/. Names are per page and the artwork is
  # regenerated rarely, so a year is fine for browsers and the CDN. No `expires`
  # here: it would add a second, conflicting max-age. Must stay above the
  # generic static-asset regex (first matching regex wins).
  location ~* ^/assets/og/[^/]+\.jpg$ {
    types { image/jpeg jpg; }
    default_type image/jpeg;
    include /etc/nginx/landing/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # --- static assets --------------------------------------------------------
  # favicon.ico has to live at the root: Google and older browsers request it
  # there whatever the page declares.
  location ~* \.(?:css|js|svg|ico|png|jpg|jpeg|webp|woff2?)$ {
    include /etc/nginx/landing/security-headers.conf;
    expires 30d;
    add_header Cache-Control "public, immutable" always;
  }

  location / {
    include /etc/nginx/landing/security-headers.conf;
    try_files $uri $uri/ $uri/index.html =404;
  }
}
