# Included into every location that declares its own add_header.
#
# nginx does not merge add_header across levels: a single add_header inside a
# location silently drops every add_header inherited from the server block.
# Keeping these in one file and including them everywhere is the only way to
# make that behaviour safe — verified 2026-08-24, the headers were missing from
# `/` before this file existed.
#
# The CSP is written to what the page actually loads: same-origin fonts
# (self-hosted under /fonts/, so no visitor IP reaches Google), plus the
# waitlist form's POST to https://use.needt.app/api/waitlist (connect-src).
# If a future edit adds an external script, it breaks here loudly instead
# of quietly shipping a third-party dependency.
#
# Every location block in nginx.conf that sets add_header (/index.html,
# /robots.txt, /sitemap.xml, /site.webmanifest, the static-asset regex, /)
# must include this file. A new location without the include serves without
# a CSP. The JSON-LD block in <head> is a data block, not executed script,
# so script-src does not govern it; the icons, og.png and the manifest are
# same-origin and covered by default-src/img-src 'self'.

add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://use.needt.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
