# Included into every location that declares its own add_header.
#
# nginx does not merge add_header across levels: a single add_header inside a
# location silently drops every add_header inherited from the server block.
# Keeping these in one file and including them everywhere is the only way to
# make that behaviour safe — verified 2026-08-24, the headers were missing from
# `/` before this file existed.
#
# The CSP is written to what the page actually loads: Google Fonts and nothing
# else. If a future edit adds an external script, it breaks here loudly instead
# of quietly shipping a third-party dependency.

add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
